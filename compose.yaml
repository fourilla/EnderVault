name: endervault

services:
  endervault:
    build:
      context: .
      dockerfile: Dockerfile
    image: endervault:local
    init: true
    user: "${ENDERVAULT_UID:-1000}:${ENDERVAULT_GID:-1000}"
    restart: "on-failure:3"
    ports:
      - "${ENDERVAULT_BIND_ADDRESS:-127.0.0.1}:${ENDERVAULT_HTTP_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-UTC}"
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      NAS_STORAGE_ROOT: /storage
    volumes:
      - type: bind
        source: "${ENDERVAULT_STATE_DIR:-./docker/runtime/state}"
        target: /var/lib/endervault
      - type: bind
        source: "${ENDERVAULT_STORAGE_PATH:-./docker/runtime/storage}"
        target: /storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - endervault

networks:
  endervault:
    driver: bridge
