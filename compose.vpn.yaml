services:
  endervault:
    depends_on:
      vpn-config:
        condition: service_completed_successfully
    environment:
      NAS_OUTBOUND_VPN_ENABLED: "true"
      NAS_OUTBOUND_VPN_PROXY_HOST: vpn
      NAS_OUTBOUND_VPN_PROXY_PORT: "8888"
      NAS_OUTBOUND_VPN_TUNNEL_HEALTH_URL: http://vpn:9999/
      NAS_OUTBOUND_VPN_CONTROL_URL: http://vpn:8000
      NAS_OUTBOUND_VPN_CONTROL_API_KEY_FILE: /var/run/endervault-vpn/auth/control-api.key
      NAS_OUTBOUND_VPN_PROFILE_NAME: "${ENDERVAULT_VPN_CONFIG_NAME:-custom.ovpn}"
    volumes:
      - type: bind
        source: "${ENDERVAULT_VPN_STATE_DIR:-./docker/runtime/vpn}"
        target: /var/run/endervault-vpn
        read_only: true

  vpn-config:
    image: python:3.13-alpine3.22
    profiles:
      - vpn
    restart: "no"
    user: "${ENDERVAULT_UID:-1000}:${ENDERVAULT_GID:-1000}"
    read_only: true
    environment:
      ENDERVAULT_VPN_INPUT_DIR: /input
      ENDERVAULT_VPN_OUTPUT_DIR: /runtime/generated
      ENDERVAULT_VPN_CONFIG_NAME: "${ENDERVAULT_VPN_CONFIG_NAME:-custom.ovpn}"
      ENDERVAULT_VPN_CONTROL_AUTH_CONFIG: /runtime/auth/config.toml
      ENDERVAULT_VPN_CONTROL_API_KEY_FILE: /runtime/auth/control-api.key
    volumes:
      - type: bind
        source: "${ENDERVAULT_VPN_CONFIG_DIR:-./docker/secrets/vpn/config}"
        target: /input
        read_only: true
      - type: bind
        source: "${ENDERVAULT_VPN_STATE_DIR:-./docker/runtime/vpn}"
        target: /runtime
      - type: bind
        source: ./docker/vpn/prepare_openvpn.py
        target: /opt/endervault/prepare_openvpn.py
        read_only: true
      - type: bind
        source: ./docker/vpn/prepare_control_api.py
        target: /opt/endervault/prepare_control_api.py
        read_only: true
    command:
      - /bin/sh
      - -ec
      - |
        python /opt/endervault/prepare_openvpn.py
        python /opt/endervault/prepare_control_api.py
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - endervault

  vpn:
    image: qmcgaw/gluetun:v3.41.2
    profiles:
      - vpn
    depends_on:
      vpn-config:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: "${TZ:-UTC}"
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: "/gluetun/generated/${ENDERVAULT_VPN_CONFIG_NAME:-custom.ovpn}"
      OPENVPN_USER_SECRETFILE: /run/secrets/openvpn_user
      OPENVPN_PASSWORD_SECRETFILE: /run/secrets/openvpn_password
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      HTTPPROXY_LOG: "off"
      HTTPPROXY_STEALTH: "on"
      HEALTH_SERVER_ADDRESS: ":9999"
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
    volumes:
      - type: bind
        source: "${ENDERVAULT_VPN_STATE_DIR:-./docker/runtime/vpn}"
        target: /gluetun
      - type: bind
        source: "${ENDERVAULT_VPN_CONFIG_DIR:-./docker/secrets/vpn/config}"
        target: /gluetun/input
        read_only: true
    secrets:
      - openvpn_user
      - openvpn_password
    expose:
      - "8888"
      - "9999"
      - "8000"
    security_opt:
      - no-new-privileges:true
    networks:
      - endervault

secrets:
  openvpn_user:
    environment: ENDERVAULT_OPENVPN_USER
  openvpn_password:
    environment: ENDERVAULT_OPENVPN_PASSWORD
