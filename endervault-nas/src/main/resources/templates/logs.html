<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Logs</title>
    <link rel="stylesheet" th:href="@{/webjars/fortawesome__fontawesome-free/6.7.2/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/notifications.js}"></script>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('logs')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section class="pathbar">
        <h1>Logs</h1>
    </section>

    <section class="dashboard-grid logs-layout" aria-label="Activity logs">
        <article class="dashboard-panel">
            <header class="section-heading">
                <h2>Log Files</h2>
            </header>
            <div class="log-file-list">
                <div class="log-file-row" th:each="logFile : ${logFiles}"
                     th:classappend="${logFile.name() == selectedFile} ? ' selected' : ''">
                    <a th:href="@{/files/logs(file=${logFile.name()})}">
                        <strong th:text="${logFile.label()}">Current log</strong>
                        <span th:text="|${logFile.sizeLabel()} - ${logFile.modifiedLabel()}|">0 B</span>
                    </a>
                    <form method="post" th:action="@{/files/logs/delete}" th:if="${logFile.deletable()}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="file" th:value="${logFile.name()}">
                        <button class="ghost icon-button action-icon" type="submit" title="Delete log file"
                                aria-label="Delete log file">
                            <i class="fas fa-trash-can" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </div>
        </article>

        <article class="dashboard-panel logs-panel">
            <header class="section-heading">
                <h2 th:text="${selectedFile}">activity-log.jsonl</h2>
                <p th:text="|Latest ${#lists.size(entries)} entries|">Latest 0 entries</p>
            </header>
            <ol class="activity-list" th:if="${not #lists.isEmpty(entries)}">
                <li th:each="entry : ${entries}">
                    <span class="activity-time" th:text="${entry.timestampLabel()}">time</span>
                    <span class="status-badge" th:classappend="${entry.statusClass()}" th:text="${entry.statusLabel()}">Success</span>
                    <strong th:text="${entry.typeLabel()}">TYPE</strong>
                    <p th:text="${entry.message()}">message</p>
                    <small th:if="${entry.path() != null or entry.targetPath() != null}"
                           th:text="${(entry.path() == null ? '-' : entry.path()) + ' -> ' + (entry.targetPath() == null ? '-' : entry.targetPath())}">path</small>
                </li>
            </ol>
            <p th:if="${#lists.isEmpty(entries)}" class="dashboard-empty">No activity entries yet.</p>
        </article>
    </section>
</main>
</div>
</div>
</body>
</html>
