<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Logs</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: logsScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('logs')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section th:replace="~{fragments/admin-shell :: pathbar('Logs', @{/admin/dashboard}, 'Back to dashboard')}"></section>

    <section class="dashboard-grid logs-layout" aria-label="Activity logs">
        <article class="dashboard-panel logs-panel">
            <header class="section-heading log-panel-heading">
                <div class="log-heading-main">
                    <h2>Activity Logs</h2>
                    <p th:text="|Showing ${logResult.firstIndex()}-${logResult.lastIndex()} of ${matchedCount} matched (${totalCount} total)|">Showing 0 entries</p>
                </div>
                <div class="log-heading-actions">
                    <form class="log-file-select-form" method="get" th:action="@{/admin/logs}">
                        <input type="hidden" name="q" th:value="${logQuery.text()}">
                        <input type="hidden" name="type" th:value="${logQuery.type()}">
                        <input type="hidden" name="status" th:value="${logQuery.status()}">
                        <input type="hidden" name="order" th:value="${logQuery.order()}">
                        <input type="hidden" name="from" th:value="${logQuery.from()}">
                        <input type="hidden" name="to" th:value="${logQuery.to()}">
                        <input type="hidden" name="size" th:value="${logQuery.size()}">
                        <label>
                            <span>Log file</span>
                            <select name="file" aria-label="Log file">
                                <option th:each="logFile : ${logFiles}"
                                        th:value="${logFile.name()}"
                                        th:text="|${logFile.label()} - ${logFile.sizeLabel()} - ${logFile.modifiedLabel()}|"
                                        th:selected="${logFile.name() == selectedFile}">Current log</option>
                            </select>
                        </label>
                        <button class="ghost icon-button action-icon" type="submit" title="Open log file"
                                aria-label="Open log file">
                            <i class="fas fa-folder-open" aria-hidden="true"></i>
                        </button>
                    </form>
                    <form method="post" th:action="@{/admin/logs/delete}"
                          th:if="${selectedLogFile != null and selectedLogFile.deletable()}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="file" th:value="${selectedFile}">
                        <button class="ghost icon-button action-icon" type="submit" title="Delete selected log file"
                                aria-label="Delete selected log file">
                            <i class="fas fa-trash-can" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </header>

            <form class="log-filter-form" method="get" th:action="@{/admin/logs}">
                <input type="hidden" name="file" th:value="${selectedFile}">
                <input type="hidden" name="page" value="1">
                <div class="log-filter-row log-filter-row-primary">
                    <label class="log-filter-search">
                        <span>Search</span>
                        <input type="text" name="q" th:value="${logQuery.text()}" placeholder="Message, path, IP, token">
                    </label>
                    <label class="log-filter-type">
                        <span>Type</span>
                        <select name="type">
                            <option value="" th:selected="${#strings.isEmpty(logQuery.type())}">All types</option>
                            <option th:each="typeOption : ${typeOptions}"
                                    th:value="${typeOption}"
                                    th:text="${typeOption}"
                                    th:selected="${typeOption == logQuery.type()}">TYPE</option>
                        </select>
                    </label>
                    <label class="log-filter-status">
                        <span>Status</span>
                        <select name="status">
                            <option value="all" th:selected="${logQuery.status() == 'all'}">All</option>
                            <option value="success" th:selected="${logQuery.status() == 'success'}">Success</option>
                            <option value="failed" th:selected="${logQuery.status() == 'failed'}">Failed</option>
                        </select>
                    </label>
                    <label class="log-filter-order">
                        <span>Order</span>
                        <select name="order">
                            <option value="newest" th:selected="${logQuery.order() == 'newest'}">Newest first</option>
                            <option value="oldest" th:selected="${logQuery.order() == 'oldest'}">Oldest first</option>
                        </select>
                    </label>
                </div>
                <div class="log-filter-row log-filter-row-secondary">
                    <label class="log-filter-from">
                        <span>From</span>
                        <input type="datetime-local" name="from" step="1" th:value="${logQuery.from()}">
                    </label>
                    <label class="log-filter-to">
                        <span>To</span>
                        <input type="datetime-local" name="to" step="1" th:value="${logQuery.to()}">
                    </label>
                    <label class="log-filter-size">
                        <span>Page size</span>
                        <select name="size">
                            <option th:each="sizeOption : ${pageSizeOptions}"
                                    th:value="${sizeOption}"
                                    th:text="${sizeOption}"
                                    th:selected="${sizeOption == logQuery.size()}">100</option>
                        </select>
                    </label>
                    <div class="log-filter-actions">
                        <button class="log-action-button" type="submit" title="Apply filters" aria-label="Apply filters">
                            <i class="fas fa-check" aria-hidden="true"></i>
                            <span>Apply</span>
                        </button>
                        <a class="button-link ghost log-action-button" th:href="@{/admin/logs(file=${selectedFile})}"
                           title="Clear filters" aria-label="Clear filters">
                            <i class="fas fa-arrow-rotate-left" aria-hidden="true"></i>
                            <span>Reset</span>
                        </a>
                    </div>
                </div>
            </form>

            <div class="table-wrap log-table-wrap" th:if="${not #lists.isEmpty(entries)}">
                <table class="log-table">
                    <thead>
                    <tr>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Type</th>
                        <th>Actor</th>
                        <th>IP</th>
                        <th>Message</th>
                        <th>Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="entry : ${entries}">
                        <td class="log-time" th:text="${entry.timestampLabel()}">time</td>
                        <td>
                            <span class="status-badge" th:classappend="${entry.statusClass()}" th:text="${entry.statusLabel()}">Success</span>
                        </td>
                        <td><code th:text="${entry.safeType()}">TYPE</code></td>
                        <td th:text="${entry.actorLabel()}">actor</td>
                        <td th:text="${entry.ipLabel()}">ip</td>
                        <td class="log-message">
                            <span th:text="${entry.messageLabel()}">message</span>
                            <small th:if="${entry.path() != null or entry.targetPath() != null}"
                                   th:text="${entry.pathLabel() + ' -> ' + entry.targetPathLabel()}">path</small>
                        </td>
                        <td class="log-details-cell">
                            <button class="ghost icon-button action-icon log-detail-open" type="button"
                                    title="View full log entry" aria-label="View full log entry"
                                    th:attr="data-log-time=${entry.timestampLabel()},
                                             data-log-status=${entry.statusLabel()},
                                             data-log-type=${entry.safeType()},
                                             data-log-actor=${entry.actorLabel()},
                                             data-log-ip=${entry.ipLabel()},
                                             data-log-message=${entry.messageLabel()},
                                             data-log-id=${entry.id()},
                                             data-log-path=${entry.pathLabel()},
                                             data-log-target=${entry.targetPathLabel()},
                                             data-log-metadata=${entry.metadataLabel()},
                                             data-log-line=${entry.detailLine()}">
                                <i class="fas fa-circle-info" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${#lists.isEmpty(entries)}" class="dashboard-empty"
               th:text="${totalCount > 0} ? 'No log entries match the current filters.' : 'No activity entries yet.'">No activity entries yet.</p>

            <nav class="pagination" th:if="${logResult.totalPages() > 1}" aria-label="Log pages">
                <a class="ghost pagination-link" th:if="${logResult.hasPrevious()}"
                   th:href="@{/admin/logs(file=${selectedFile}, q=${logQuery.text()}, type=${logQuery.type()}, status=${logQuery.status()}, order=${logQuery.order()}, from=${logQuery.from()}, to=${logQuery.to()}, page=1, size=${logQuery.size()})}">First</a>
                <span class="ghost pagination-link disabled" th:unless="${logResult.hasPrevious()}">First</span>
                <a class="ghost pagination-link" th:if="${logResult.hasPrevious()}"
                   th:href="@{/admin/logs(file=${selectedFile}, q=${logQuery.text()}, type=${logQuery.type()}, status=${logQuery.status()}, order=${logQuery.order()}, from=${logQuery.from()}, to=${logQuery.to()}, page=${logResult.previousPage()}, size=${logQuery.size()})}">Previous</a>
                <span class="ghost pagination-link disabled" th:unless="${logResult.hasPrevious()}">Previous</span>
                <span class="page-status" th:text="|Page ${logResult.page()} of ${logResult.totalPages()}|">Page 1 of 1</span>
                <a class="ghost pagination-link" th:if="${logResult.hasNext()}"
                   th:href="@{/admin/logs(file=${selectedFile}, q=${logQuery.text()}, type=${logQuery.type()}, status=${logQuery.status()}, order=${logQuery.order()}, from=${logQuery.from()}, to=${logQuery.to()}, page=${logResult.nextPage()}, size=${logQuery.size()})}">Next</a>
                <span class="ghost pagination-link disabled" th:unless="${logResult.hasNext()}">Next</span>
                <a class="ghost pagination-link" th:if="${logResult.hasNext()}"
                   th:href="@{/admin/logs(file=${selectedFile}, q=${logQuery.text()}, type=${logQuery.type()}, status=${logQuery.status()}, order=${logQuery.order()}, from=${logQuery.from()}, to=${logQuery.to()}, page=${logResult.totalPages()}, size=${logQuery.size()})}">Last</a>
                <span class="ghost pagination-link disabled" th:unless="${logResult.hasNext()}">Last</span>
            </nav>
        </article>
    </section>

    <dialog class="log-detail-modal" id="logDetailModal" aria-labelledby="logDetailTitle">
        <article class="log-detail-modal-card">
            <header class="log-detail-header">
                <div>
                    <h2 id="logDetailTitle">Log Entry</h2>
                    <p id="logDetailSubtitle">-</p>
                </div>
                <form method="dialog">
                    <button class="ghost icon-button action-icon log-detail-close" type="submit"
                            title="Close details" aria-label="Close details">
                        <i class="fas fa-xmark" aria-hidden="true"></i>
                    </button>
                </form>
            </header>
            <p class="log-detail-line" id="logDetailLine">-</p>
            <dl class="log-detail-grid">
                <div>
                    <dt>ID</dt>
                    <dd id="logDetailId">-</dd>
                </div>
                <div>
                    <dt>Actor</dt>
                    <dd id="logDetailActor">-</dd>
                </div>
                <div>
                    <dt>IP</dt>
                    <dd id="logDetailIp">-</dd>
                </div>
                <div>
                    <dt>Message</dt>
                    <dd id="logDetailMessage">-</dd>
                </div>
                <div>
                    <dt>Path</dt>
                    <dd id="logDetailPath">-</dd>
                </div>
                <div>
                    <dt>Target</dt>
                    <dd id="logDetailTarget">-</dd>
                </div>
                <div>
                    <dt>Metadata</dt>
                    <dd id="logDetailMetadata">-</dd>
                </div>
            </dl>
        </article>
    </dialog>
</main>
</div>
</div>
</body>
</html>
