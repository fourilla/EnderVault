<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Remote Download</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: remoteDownloadScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('remote')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section class="pathbar">
        <h1>Remote Download</h1>
        <a class="ghost icon-button" th:href="@{/files/remote-download}" title="Refresh" aria-label="Refresh">
            <i class="fas fa-rotate" aria-hidden="true"></i>
        </a>
    </section>

    <section class="dashboard-panel remote-download-panel" aria-label="New remote download">
        <form id="remoteDownloadForm" class="remote-download-form" method="post"
              th:action="@{/files/remote-download/inspect}"
              th:attr="data-start-url=@{/files/remote-download}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                URL
                <input type="url" name="url" placeholder="https://example.com/file.mp4" required>
            </label>
            <label>
                Save to
                <input type="text" name="path" placeholder="Vault directory path, blank for root">
            </label>
            <button class="icon-button" type="submit" title="Inspect remote file" aria-label="Inspect remote file">
                <i class="fas fa-cloud-arrow-down" aria-hidden="true"></i>
                <span class="visually-hidden">Inspect remote file</span>
            </button>
        </form>
    </section>

    <dialog id="remoteConfirmDialog" class="remote-confirm-dialog js-only" aria-labelledby="remoteConfirmTitle">
        <form method="dialog" class="remote-confirm-card">
            <header class="remote-confirm-header">
                <div>
                    <h2 id="remoteConfirmTitle">Confirm Download</h2>
                    <p>Check the remote file before the server starts downloading it.</p>
                </div>
                <button class="ghost icon-button" type="button" data-remote-confirm-close
                        title="Cancel" aria-label="Cancel">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </header>
            <dl class="remote-confirm-details">
                <div>
                    <dt>File name</dt>
                    <dd data-remote-probe="fileName">-</dd>
                </div>
                <div>
                    <dt>Save to</dt>
                    <dd data-remote-probe="targetPath">-</dd>
                </div>
                <div>
                    <dt>Size</dt>
                    <dd data-remote-probe="contentLengthLabel">-</dd>
                </div>
                <div>
                    <dt>Type</dt>
                    <dd data-remote-probe="contentTypeLabel">-</dd>
                </div>
                <div>
                    <dt>Final URL</dt>
                    <dd data-remote-probe="finalUrl">-</dd>
                </div>
            </dl>
            <p class="remote-confirm-warning" data-remote-warning hidden></p>
            <footer class="remote-confirm-actions">
                <button class="ghost" type="button" data-remote-confirm-close>Cancel</button>
                <button type="button" data-remote-confirm-start>
                    <i class="fas fa-cloud-arrow-down" aria-hidden="true"></i>
                    <span>Start Download</span>
                </button>
            </footer>
        </form>
    </dialog>

    <section id="remoteTasksSection" class="browser-section" th:hidden="${#lists.isEmpty(tasks)}"
             aria-label="Remote download tasks"
             th:attr="data-tasks-url=@{/files/remote-download/tasks},data-cancel-url=@{/files/remote-download/cancel},data-delete-url=@{/files/remote-download/delete}">
        <header class="section-heading">
            <h2 id="remoteTasksHeading" th:text="|Tasks (${#lists.size(tasks)})|">Tasks</h2>
        </header>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Source</th>
                    <th>Target</th>
                    <th>Status</th>
                    <th>Progress</th>
                    <th>Created</th>
                    <th>Finished</th>
                    <th>Message</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="remoteTasksBody">
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.shortId()}">task</td>
                    <td class="remote-source" th:title="${task.sourceUrl()}" th:text="${task.sourceUrl()}">url</td>
                    <td th:text="${task.targetPath() != null ? task.targetPath() : task.targetDirectory()}">target</td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${task.statusClass()}"
                              th:text="${task.statusLabel()}">Queued</span>
                    </td>
                    <td>
                        <div class="remote-progress">
                            <div class="upload-progress-track" role="progressbar"
                                 aria-valuemin="0" aria-valuemax="100"
                                 th:attr="aria-valuenow=${task.progressPercent()}">
                                <div class="upload-progress-bar"
                                     th:style="|width: ${task.progressPercent()}%|"></div>
                            </div>
                            <span th:text="${task.progressLabel()}">0 B</span>
                        </div>
                    </td>
                    <td th:text="${task.createdLabel()}">created</td>
                    <td th:text="${task.finishedLabel()}">finished</td>
                    <td class="remote-message" th:text="${task.message()}">message</td>
                    <td>
                        <div class="table-actions">
                            <form class="row-form" method="post" th:if="${task.active()}" th:action="@{/files/remote-download/cancel}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="id" th:value="${task.id()}">
                                <button class="danger icon-button action-icon" type="submit"
                                        data-remote-action="cancel" th:attr="data-task-id=${task.id()}"
                                        title="Cancel" aria-label="Cancel">
                                    <i class="fas fa-ban" aria-hidden="true"></i>
                                </button>
                            </form>
                            <form class="row-form" method="post" th:if="${!task.active()}" th:action="@{/files/remote-download/delete}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="id" th:value="${task.id()}">
                                <button class="ghost icon-button action-icon" type="submit"
                                        data-remote-action="delete" th:attr="data-task-id=${task.id()}"
                                        title="Remove task" aria-label="Remove task">
                                    <i class="fas fa-trash-can" aria-hidden="true"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <p id="remoteTasksEmpty" th:hidden="${not #lists.isEmpty(tasks)}" class="empty browser-grid-empty">No remote downloads yet.</p>
</main>
</div>
</div>
</body>
</html>
