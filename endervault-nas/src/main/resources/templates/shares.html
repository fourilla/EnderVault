<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Shared Links</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/files}">EnderVault</a>
    <nav class="top-actions">
        <a th:href="@{/files}">Files</a>
        <form method="post" th:action="@{/logout}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ghost" type="submit">Log out</button>
        </form>
    </nav>
</header>

<main class="workspace">
    <section class="pathbar">
        <h1>Shared Links</h1>
        <form class="row-form" method="post" th:action="@{/files/shares/delete-expired}" th:if="${not #lists.isEmpty(shares)}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ghost" type="submit">Delete expired</button>
        </form>
    </section>

    <p class="alert" th:if="${message}" th:text="${message}"></p>

    <section class="table-wrap" aria-label="Shared links">
        <table>
            <thead>
            <tr>
                <th>Link</th>
                <th>Target</th>
                <th>Type</th>
                <th>Created</th>
                <th>Expires</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="share : ${shares}">
                <td>
                    <input readonly th:value="${shareBaseUrl + share.token()}">
                </td>
                <td class="item-name" th:text="${share.path()}">path</td>
                <td th:text="${share.type()}">FILE</td>
                <td th:text="${share.createdAt()}">created</td>
                <td th:text="${share.expiresAt() == null ? 'Never' : share.expiresAt()}">expires</td>
                <td th:text="${share.statusLabel()}">Active</td>
                <td>
                    <form class="row-form" method="post" th:action="@{/files/shares/revoke}" th:if="${share.active()}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="token" th:value="${share.token()}">
                        <button class="danger" type="submit">Revoke</button>
                    </form>
                    <form class="row-form" method="post" th:action="@{/files/shares/delete}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="token" th:value="${share.token()}">
                        <button class="ghost" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(shares)}">
                <td colspan="7" class="empty">No shared links yet.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
