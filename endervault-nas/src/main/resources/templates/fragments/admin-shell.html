<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="sidebar-brand" th:href="@{/files}">EnderVault</a>
    <nav class="sidebar-nav" aria-label="Primary navigation">
        <a th:classappend="${active == 'dashboard'} ? ' active' : ''" th:href="@{/admin/dashboard}">
            <i class="fas fa-gauge-high" aria-hidden="true"></i>
            <span>Dashboard</span>
        </a>
        <a th:classappend="${active == 'files'} ? ' active' : ''" th:href="@{/files}">
            <i class="fas fa-folder" aria-hidden="true"></i>
            <span>Files</span>
        </a>
        <a th:classappend="${active == 'recent'} ? ' active' : ''" th:href="@{/files/recent}">
            <i class="fas fa-clock" aria-hidden="true"></i>
            <span>Recent</span>
        </a>
        <a th:classappend="${active == 'bookmarks'} ? ' active' : ''" th:href="@{/files/bookmarks}">
            <i class="fas fa-bookmark" aria-hidden="true"></i>
            <span>Bookmarks</span>
        </a>
    </nav>

    <div class="sidebar-favorites-shell">
        <details class="sidebar-favorites" open>
            <summary>
                <i class="fas fa-star" aria-hidden="true"></i>
                <span>Favorites</span>
            </summary>
            <div class="sidebar-favorites-list" data-sidebar-favorites-list>
                <a th:each="favorite : ${favorites}"
                   th:href="${favorite.directory()} ? @{/files(path=${favorite.path()})} : @{/files/detail(path=${favorite.path()})}"
                   th:title="${favorite.path()}"
                   th:attr="data-favorite-sidebar-path=${favorite.path()}">
                    <i th:class="${favorite.iconClass()}" aria-hidden="true"></i>
                    <span th:text="${favorite.name()}">favorite</span>
                </a>
            </div>
            <p th:if="${#lists.isEmpty(favorites)}" data-sidebar-favorites-empty>No favorites yet.</p>
        </details>
        <a class="ghost icon-button action-icon sidebar-favorites-edit"
           th:classappend="${active == 'favorites'} ? ' active' : ''"
           th:href="@{/files/favorites}"
           title="Manage favorites" aria-label="Manage favorites">
            <i class="fas fa-pen-to-square" aria-hidden="true"></i>
        </a>
    </div>

    <section class="sidebar-usage" th:if="${storageUsage != null}" aria-label="Disk usage">
        <p>Disk usage</p>
        <strong th:text="|${storageUsage.usedLabel()} / ${storageUsage.totalLabel()}|">0 B / 0 B</strong>
        <span th:text="|${storageUsage.usedPercent()}% used / ${storageUsage.usableLabel()} free|">0% used / 0 B free</span>
    </section>
</aside>

<header class="topbar app-topbar" th:fragment="topbar">
    <div class="topbar-actions">
        <a class="ghost icon-button topbar-readonly" th:href="@{/files/read-only(path=${path})}" title="Open read-only mode"
           aria-label="Open read-only mode">
            <i class="fas fa-mobile-screen-button" aria-hidden="true"></i>
        </a>
    </div>
    <form method="post" th:action="@{/logout}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="ghost icon-button" type="submit" title="Log out" aria-label="Log out">
            <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
        </button>
    </form>
</header>
</body>
</html>
