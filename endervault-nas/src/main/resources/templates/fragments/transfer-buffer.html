<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="panel(buffer, currentPath, pasteEnabled, returnTo)">
    <div data-transfer-buffer-region
         th:data-current-path="${currentPath}"
         th:data-transfer-paste-enabled="${pasteEnabled}"
         th:data-return-to="${returnTo}">
        <section class="transfer-buffer-panel" th:if="${buffer.active()}" aria-label="Transfer buffer">
            <div class="transfer-buffer-header">
                <div class="transfer-buffer-summary">
                    <i class="fas fa-layer-group" aria-hidden="true"></i>
                    <div>
                        <strong>Transfer buffer</strong>
                        <p th:text="|${buffer.count()} item(s) ready. Open a directory and choose what to do here.|">
                            1 item ready.
                        </p>
                    </div>
                </div>
                <div class="transfer-buffer-header-controls">
                    <form class="row-form" method="post" th:action="@{/files/transfer/clear}"
                          data-transfer-action="transfer-clear">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="path" th:value="${currentPath}">
                        <input type="hidden" name="returnTo" th:if="${returnTo != null}" th:value="${returnTo}">
                        <button class="ghost transfer-buffer-clear" type="submit">
                            Clear buffer
                        </button>
                    </form>
                    <button class="ghost icon-button transfer-buffer-toggle js-only" type="button"
                            title="Minimize transfer buffer" aria-label="Minimize transfer buffer"
                            aria-expanded="true">
                        <i class="fas fa-chevron-down" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <ul class="transfer-buffer-list">
                <li th:each="item : ${buffer.items()}">
                    <i th:class="${item.iconClass()}" aria-hidden="true"></i>
                    <span th:title="${item.path()}" th:text="${item.name()}">item</span>
                    <form class="row-form" method="post" th:action="@{/files/transfer/remove}"
                          data-transfer-action="transfer-remove">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="path" th:value="${currentPath}">
                        <input type="hidden" name="itemPath" th:value="${item.path()}">
                        <input type="hidden" name="returnTo" th:if="${returnTo != null}" th:value="${returnTo}">
                        <button class="transfer-buffer-remove" type="submit"
                                th:title="|Remove ${item.name()} from transfer buffer|"
                                th:attr="aria-label=|Remove ${item.name()} from transfer buffer|">
                            <i class="fas fa-xmark" aria-hidden="true"></i>
                        </button>
                    </form>
                </li>
            </ul>
            <div class="transfer-buffer-actions" th:if="${pasteEnabled}">
                <form class="row-form" method="post" th:action="@{/files/transfer/paste}"
                      data-transfer-action="transfer-paste">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="path" th:value="${currentPath}">
                    <input type="hidden" name="operation" value="move">
                    <button class="ghost" type="submit">
                        <i class="fas fa-file-import" aria-hidden="true"></i>
                        Move here
                    </button>
                </form>
                <form class="row-form" method="post" th:action="@{/files/transfer/paste}"
                      data-transfer-action="transfer-paste">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="path" th:value="${currentPath}">
                    <input type="hidden" name="operation" value="copy">
                    <button class="ghost" type="submit">
                        <i class="fas fa-copy" aria-hidden="true"></i>
                        Copy here
                    </button>
                </form>
            </div>
        </section>
    </div>
</th:block>
</body>
</html>
