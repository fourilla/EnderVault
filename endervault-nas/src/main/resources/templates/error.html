<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'Error'">Error</title>
    <th:block th:replace="~{fragments/assets :: styles(false)}"></th:block>
</head>
<body>
<main class="auth-shell">
    <section class="auth-panel">
        <p class="eyebrow">EnderVault</p>
        <h1 th:text="${title} ?: 'Error'">Error</h1>
        <p class="alert error" th:text="${message} ?: 'Something went wrong.'">Something went wrong.</p>
        <a class="text-link" th:href="@{/}">Go home</a>
    </section>
</main>
</body>
</html>
