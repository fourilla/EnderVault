<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Telegram Alerts</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: jsOnlyNoscript}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: adminActionsScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace dashboard-workspace telegram-settings-workspace">
    <section class="pathbar">
        <a class="ghost icon-button" th:href="@{/admin/settings}" title="Back to settings" aria-label="Back to settings">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </a>
        <h1>Telegram Alerts</h1>
    </section>

    <section class="dashboard-panel telegram-settings-panel" id="telegram-alerts">
        <header class="section-heading">
            <div>
                <h2>Activity Notifications</h2>
                <p th:text="|Config: ${telegramSettings.configPath()}|">Config: endervault-nas.properties</p>
            </div>
            <span data-telegram-status
                  class="status-badge"
                  th:classappend="${telegramSettings.enabled()} ? ' active' : ' expired'"
                  th:text="${telegramSettings.enabled()} ? 'Enabled' : 'Disabled'">Enabled</span>
        </header>

        <form class="telegram-settings-form"
              method="post"
              th:action="@{/admin/settings/telegram-alerts}"
              data-ajax-action="telegram-settings-save">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="dashboard-actions telegram-actions telegram-actions-top">
                <button class="primary icon-text-button" type="submit" data-ajax-action="telegram-settings-save">
                    <i class="fas fa-floppy-disk" aria-hidden="true"></i>
                    <span>Save and Apply</span>
                </button>
            </div>

            <section class="telegram-settings-section" aria-label="Telegram connection settings">
                <header class="telegram-subsection-heading">
                    <h3>Telegram Connection</h3>
                    <p>Configure the bot target used for selected activity alerts.</p>
                </header>
                <div class="telegram-settings-grid">
                    <label class="telegram-master-toggle">
                        <input type="checkbox" name="enabled" value="true" th:checked="${telegramSettings.enabled()}">
                        <span>
                            <strong>Enable Telegram alerts</strong>
                            <small>Send selected activity logs to Telegram.</small>
                        </span>
                    </label>
                    <div class="telegram-field telegram-token-field">
                        <label for="telegramBotToken">Bot token</label>
                        <div class="password-field">
                        <input type="password"
                               id="telegramBotToken"
                               name="botToken"
                               autocomplete="off"
                               spellcheck="false"
                               data-password-toggle-input
                               th:value="${telegramSettings.botToken()}">
                            <button class="ghost icon-button password-toggle js-only"
                                    type="button"
                                    data-password-toggle
                                    title="Show bot token"
                                    aria-label="Show bot token"
                                    aria-pressed="false">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <label>
                        <span>Chat ID</span>
                        <input type="text"
                               name="chatId"
                               autocomplete="off"
                               spellcheck="false"
                               th:value="${telegramSettings.chatId()}">
                    </label>
                    <div class="telegram-connection-actions">
                        <button class="ghost icon-text-button"
                                type="submit"
                                th:formaction="@{/admin/settings/telegram-alerts/test}"
                                data-ajax-action="telegram-settings-test">
                            <i class="fas fa-paper-plane" aria-hidden="true"></i>
                            <span>Send Test Message</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="telegram-settings-section" aria-label="Activity type alert settings">
                <header class="telegram-subsection-heading">
                    <h3>Activity Types</h3>
                    <p>Choose which log categories are sent to Telegram.</p>
                </header>
                <div class="telegram-activity-settings">
                    <section class="telegram-activity-group" th:each="group : ${telegramSettings.groups()}">
                        <h4 th:text="${group.name()}">Authentication</h4>
                        <div class="telegram-activity-grid">
                            <label class="telegram-activity-toggle" th:each="activity : ${group.activities()}">
                                <input type="hidden" name="activityKeys" th:value="${activity.key()}">
                                <input type="checkbox"
                                       value="true"
                                       th:name="${'activity.' + activity.key()}"
                                       th:checked="${activity.enabled()}">
                                <span>
                                    <strong th:text="${activity.label()}">Login success</strong>
                                    <small th:text="${activity.type()}">LOGIN_SUCCESS</small>
                                </span>
                            </label>
                        </div>
                    </section>
                </div>
            </section>
        </form>
    </section>
</main>
</div>
</div>
</body>
</html>
