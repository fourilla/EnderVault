<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${item.name()}">Shared File</title>
    <link rel="stylesheet" th:href="@{/webjars/fortawesome__fontawesome-free/6.7.2/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">EnderVault Share</a>
</header>

<main class="workspace">
    <section class="shared-summary">
        <p class="eyebrow">Shared file</p>
        <h1 th:text="${item.name()}">file</h1>
        <dl class="details">
            <div>
                <dt>Type</dt>
                <dd th:text="${item.mediaType()}">type</dd>
            </div>
            <div>
                <dt>Size</dt>
                <dd th:text="${item.sizeLabel()}">size</dd>
            </div>
            <div>
                <dt>Modified</dt>
                <dd th:text="${item.modifiedLabel()}">modified</dd>
            </div>
        </dl>
        <div class="bulk-actions">
            <a class="button-link icon-button" th:href="@{/s/{token}/download(token=${token})}"
               title="Download" aria-label="Download">
                <i class="fas fa-download" aria-hidden="true"></i>
            </a>
            <a class="button-link ghost icon-button" th:if="${item.previewable()}" th:href="@{/s/{token}/preview(token=${token})}" target="_blank"
               title="Preview" aria-label="Preview">
                <i class="fas fa-eye" aria-hidden="true"></i>
            </a>
        </div>
    </section>
</main>
</body>
</html>
