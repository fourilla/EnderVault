<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${detail.name()}">EnderVault Detail</title>
    <link rel="stylesheet" th:href="@{/webjars/fortawesome__fontawesome-free/6.7.2/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/notifications.js}"></script>
    <script defer th:src="@{/js/admin-actions.js}"></script>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('files')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section class="pathbar" aria-label="Current path">
        <a class="button-link ghost icon-button" th:href="@{/files(path=${detail.parentPath()})}"
           title="Back to directory" aria-label="Back to directory">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </a>
        <span class="muted" th:text="${detail.path()}">path</span>
    </section>

    <section class="detail-panel" th:if="${not detail.directory() and detail.previewable()}">
        <h2>Preview</h2>
        <div class="preview-surface">
            <img class="preview-media" th:if="${detail.image()}" th:src="@{/files/detail/preview(path=${detail.path()})}" th:alt="${detail.name()}">
            <video class="preview-media" th:if="${detail.video()}" controls
                   th:poster="@{/files/detail/thumbnail(path=${detail.path()})}"
                   th:src="@{/files/detail/preview(path=${detail.path()})}"></video>
            <iframe class="preview-frame" th:if="${detail.text() or detail.pdf()}" th:src="@{/files/detail/preview(path=${detail.path()})}" title="Preview"></iframe>
        </div>
    </section>

    <section class="detail-layout">
        <article class="detail-panel detail-main">
            <p class="eyebrow" th:text="${detail.directory() ? 'Directory' : 'File'}">File</p>
            <h1 th:text="${detail.name()}">name</h1>

            <div class="detail-actions">
                <a class="button-link icon-button" th:if="${detail.directory()}" th:href="@{/files(path=${detail.path()})}"
                   title="Open directory" aria-label="Open directory">
                    <i class="fas fa-folder-open" aria-hidden="true"></i>
                </a>
                <a class="button-link icon-button" th:if="${detail.directory()}" th:href="@{/files/detail/download.zip(path=${detail.path()})}"
                   title="Download zip" aria-label="Download zip">
                    <i class="fas fa-file-zipper" aria-hidden="true"></i>
                </a>
                <a class="button-link icon-button" th:unless="${detail.directory()}" th:href="@{/files/detail/download(path=${detail.path()})}"
                   title="Download" aria-label="Download">
                    <i class="fas fa-download" aria-hidden="true"></i>
                </a>
                <a class="button-link ghost icon-button" th:if="${not detail.directory() and detail.previewable()}" th:href="@{/files/detail/preview(path=${detail.path()})}" target="_blank"
                   title="Preview" aria-label="Preview">
                    <i class="fas fa-eye" aria-hidden="true"></i>
                </a>
            </div>

            <dl class="details">
                <div>
                    <dt>Name</dt>
                    <dd th:text="${detail.name()}">name</dd>
                </div>
                <div>
                    <dt>Path</dt>
                    <dd th:text="${detail.path()}">path</dd>
                </div>
                <div>
                    <dt>Type</dt>
                    <dd th:text="${detail.mediaType()}">type</dd>
                </div>
                <div th:unless="${detail.directory()}">
                    <dt>Extension</dt>
                    <dd th:text="${#strings.isEmpty(detail.extension()) ? '-' : detail.extension()}">ext</dd>
                </div>
                <div th:unless="${detail.directory()}">
                    <dt>Size</dt>
                    <dd th:text="${detail.sizeLabel()}">size</dd>
                </div>
                <div th:if="${detail.directory()}">
                    <dt>Items</dt>
                    <dd th:text="${detail.childCount()}">0</dd>
                </div>
                <div>
                    <dt>Created</dt>
                    <dd th:text="${detail.createdLabel()}">created</dd>
                </div>
                <div>
                    <dt>Modified</dt>
                    <dd th:text="${detail.modifiedLabel()}">modified</dd>
                </div>
                <div>
                    <dt>Accessed</dt>
                    <dd th:text="${detail.accessedLabel()}">accessed</dd>
                </div>
            </dl>
        </article>

        <aside class="detail-panel">
            <h2>Manage</h2>
            <form class="stack" method="post" th:action="@{/files/detail/rename}" data-ajax-action="detail-rename">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="path" th:value="${detail.path()}">
                <label>
                    Rename
                    <input name="newName" th:value="${detail.name()}" required>
                </label>
                <button type="submit">Rename</button>
            </form>

            <form class="stack" method="post" th:action="@{/files/detail/move}" data-ajax-action="detail-move">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="path" th:value="${detail.path()}">
                <label>
                    Move to
                    <input name="targetPath" placeholder="Target path" required>
                </label>
                <button type="submit">Move</button>
            </form>

            <form class="stack" method="post" th:action="@{/files/detail/delete}" data-ajax-action="detail-delete">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="path" th:value="${detail.path()}">
                <button class="danger icon-button" type="submit" title="Delete" aria-label="Delete">
                    <i class="fas fa-trash-can" aria-hidden="true"></i>
                </button>
            </form>
        </aside>
    </section>

    <section class="detail-panel">
        <h2>Share</h2>
        <form class="tool-form" method="post" th:action="@{/files/detail/share}"
              data-ajax-action="share-create" data-share-table="#detailShareRows">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="path" th:value="${detail.path()}">
            <input type="number" min="1" name="expiresInDays" inputmode="numeric" placeholder="Days">
            <button type="submit">Create link</button>
        </form>

        <div class="table-wrap compact-table" aria-label="Shared links for this item">
            <table>
                <thead>
                <tr>
                    <th>Link</th>
                    <th>Created</th>
                    <th>Expires</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="detailShareRows">
                <tr th:each="share : ${shares}"
                    th:attr="data-share-token=${share.token()},data-share-status=${share.statusClass()}">
                    <td><input readonly th:value="${shareBaseUrl + share.token()}"></td>
                    <td th:text="${share.createdLabel()}">created</td>
                    <td th:text="${share.expiresLabel()}">expires</td>
                    <td>
                        <span class="status-badge" th:classappend="${share.statusClass()}" th:text="${share.statusLabel()}">Active</span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <form class="row-form" method="post" th:action="@{/files/detail/shares/revoke}" th:if="${share.active()}"
                                  data-ajax-action="share-revoke">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="path" th:value="${detail.path()}">
                                <input type="hidden" name="token" th:value="${share.token()}">
                                <button class="danger icon-button action-icon" type="submit" title="Revoke" aria-label="Revoke">
                                    <i class="fas fa-link-slash" aria-hidden="true"></i>
                                </button>
                            </form>
                            <form class="row-form" method="post" th:action="@{/files/detail/shares/delete}"
                                  data-ajax-action="share-delete">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="path" th:value="${detail.path()}">
                                <input type="hidden" name="token" th:value="${share.token()}">
                                <button class="ghost icon-button action-icon" type="submit" title="Delete" aria-label="Delete">
                                    <i class="fas fa-trash-can" aria-hidden="true"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr class="empty-row" th:if="${#lists.isEmpty(shares)}">
                    <td colspan="5" class="empty">No shared links yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
</div>
</body>
</html>
