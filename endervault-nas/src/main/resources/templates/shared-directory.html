<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Directory</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: jsOnlyNoscript}"></th:block>
    <th:block th:replace="~{fragments/assets :: selectionScript}"></th:block>
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/s/{token}(token=${token})}">EnderVault Share</a>
</header>

<main class="workspace">
    <section th:replace="~{fragments/breadcrumbs :: shared(${listing}, ${token})}"></section>

    <section class="toolbar" aria-label="Download tools">
        <form id="bulkActionForm" method="get" th:action="@{/s/{token}/download.zip(token=${token})}">
            <input type="hidden" name="path" th:value="${path}">
        </form>
        <button class="button-link shared-download-button" id="downloadSelectedButton" form="bulkActionForm"
                type="submit" title="Download selected file" aria-label="Download selected file">
            <i class="fas fa-download" aria-hidden="true"></i>
            <span>Download selected file</span>
        </button>
    </section>

    <section class="browser-section" aria-label="Shared directory">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th th:replace="~{fragments/tables :: selectHeader('Select all items in this table')}"></th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Modified</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dir : ${listing.directories()}">
                    <td class="select-cell"><input form="bulkActionForm" type="checkbox" name="items" th:value="${dir.name()}"></td>
                    <td><a class="item-name directory" th:href="@{/s/{token}(token=${token}, path=${dir.path()})}">
                        <i class="fas fa-folder item-icon" aria-hidden="true"></i>
                        <span th:text="${dir.name()}">directory</span>
                    </a></td>
                    <td>Directory</td>
                    <td>-</td>
                    <td th:text="${dir.modifiedLabel()}">-</td>
                    <td>-</td>
                </tr>
                <tr th:each="file : ${listing.files()}">
                    <td class="select-cell"><input form="bulkActionForm" type="checkbox" name="items" th:value="${file.name()}"></td>
                    <td><a class="item-name" th:href="${filePreview.sharedDirectoryFileUrl(token, file)}"
                           th:text="${file.name()}">file</a></td>
                    <td th:text="${file.mediaType()}">type</td>
                    <td th:text="${file.sizeLabel()}">0 B</td>
                    <td th:text="${file.modifiedLabel()}">-</td>
                    <td>
                        <div class="table-actions">
                            <th:block th:replace="~{fragments/file-actions :: links(${fileActions.sharedDirectoryActions(token, file)})}"></th:block>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listing.directories()) and #lists.isEmpty(listing.files())}">
                    <td colspan="6" class="empty">This shared directory is empty.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
