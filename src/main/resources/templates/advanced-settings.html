<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Advanced Settings</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: adminActionsScript}"></th:block>
    <th:block th:replace="~{fragments/assets :: settingsFormScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace dashboard-workspace settings-workspace advanced-settings-workspace">
    <section th:replace="~{fragments/admin-shell :: pathbar('Advanced Settings', @{/admin/settings}, 'Back to settings')}"></section>

    <section class="dashboard-panel settings-detail-panel">
        <header class="section-heading">
            <div>
                <h2>Advanced Settings</h2>
                <p th:text="'Saved to ' + ${settings.configPath()}">Saved to endervault-nas.properties</p>
            </div>
        </header>

        <nav class="settings-section-nav" aria-label="Advanced settings sections">
            <a th:each="group : ${settings.groups()}"
               th:href="${'#' + group.id()}"
               th:text="${group.title()}">Section</a>
            <a href="#deployment">Deployment</a>
        </nav>

        <form class="general-settings-form advanced-settings-form"
              method="post"
              th:action="@{/api/v1/settings/advanced}"
              data-ajax-action="advanced-settings-save"
              data-settings-form>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:replace="~{fragments/settings :: saveBar}"></div>

            <section class="settings-detail-section"
                     th:each="group : ${settings.groups()}"
                     th:id="${group.id()}"
                     th:attr="aria-label=${group.title()}">
                <header class="settings-subsection-heading">
                    <div>
                        <h3 th:text="${group.title()}">Group</h3>
                        <p th:text="${group.description()}">Description</p>
                    </div>
                </header>

                <div class="settings-field-grid advanced-settings-grid">
                    <th:block th:each="field : ${group.fields()}">
                        <label class="settings-inline-toggle"
                               th:if="${field.type() == 'boolean'}">
                            <span>
                                <strong th:text="${field.label()}">Setting</strong>
                                <small th:text="${field.description()}">Description</small>
                                <em class="settings-restart-note" th:if="${field.restartRequired()}">Restart required</em>
                            </span>
                            <input class="settings-switch-input"
                                   type="checkbox"
                                   th:name="${field.name()}"
                                   th:attr="data-settings-sensitive=${field.confirmationRequired() ? 'true' : null}"
                                   th:checked="${field.value() == 'true'}">
                        </label>

                        <label th:if="${field.type() == 'number'}">
                            <span class="settings-field-label">
                                <span th:text="${field.label()}">Setting</span>
                                <em class="settings-restart-note" th:if="${field.restartRequired()}">Restart required</em>
                            </span>
                            <div class="settings-unit-field">
                                <input type="number"
                                       th:name="${field.name()}"
                                       th:value="${field.value()}"
                                       th:min="${field.min()}"
                                       th:max="${field.max()}"
                                       th:step="${field.step()}"
                                       th:attr="data-settings-sensitive=${field.confirmationRequired() ? 'true' : null}">
                                <span th:if="${!field.unit().isBlank()}" th:text="${field.unit()}">unit</span>
                            </div>
                            <small th:text="${field.description()}">Description</small>
                        </label>

                        <label th:if="${field.type() == 'text'}">
                            <span class="settings-field-label">
                                <span th:text="${field.label()}">Setting</span>
                                <em class="settings-restart-note" th:if="${field.restartRequired()}">Restart required</em>
                            </span>
                            <input type="text" th:name="${field.name()}" th:value="${field.value()}"
                                   th:attr="data-settings-sensitive=${field.confirmationRequired() ? 'true' : null}">
                            <small th:text="${field.description()}">Description</small>
                        </label>

                        <label th:if="${field.type() == 'textarea'}">
                            <span class="settings-field-label">
                                <span th:text="${field.label()}">Setting</span>
                                <em class="settings-restart-note" th:if="${field.restartRequired()}">Restart required</em>
                            </span>
                            <textarea rows="3" th:name="${field.name()}" th:text="${field.value()}"
                                      th:attr="data-settings-sensitive=${field.confirmationRequired() ? 'true' : null}"></textarea>
                            <small th:text="${field.description()}">Description</small>
                        </label>

                        <label th:if="${field.type() == 'select'}">
                            <span class="settings-field-label">
                                <span th:text="${field.label()}">Setting</span>
                                <em class="settings-restart-note" th:if="${field.restartRequired()}">Restart required</em>
                            </span>
                            <select th:name="${field.name()}"
                                    th:attr="data-settings-sensitive=${field.confirmationRequired() ? 'true' : null}">
                                <option th:each="choice : ${field.choices()}"
                                        th:value="${choice.value()}"
                                        th:text="${choice.label()}"
                                        th:selected="${choice.value() == field.value()}">Choice</option>
                            </select>
                            <small th:text="${field.description()}">Description</small>
                        </label>
                    </th:block>
                </div>
            </section>
        </form>

        <section class="settings-detail-section" id="deployment" aria-label="Deployment-managed settings">
            <header class="settings-subsection-heading">
                <div>
                    <h3>Deployment</h3>
                    <p>These effective values are shown for diagnosis and must be changed outside the running web UI.</p>
                </div>
            </header>
            <dl class="settings-readonly-list">
                <div th:each="item : ${settings.deployment()}">
                    <dt th:text="${item.label()}">Setting</dt>
                    <dd>
                        <code th:text="${item.value()}">value</code>
                        <small th:text="${item.description()}">Description</small>
                    </dd>
                </div>
            </dl>
        </section>
    </section>
</main>
</div>
</div>
</body>
</html>
