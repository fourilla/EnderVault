<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${bookmark.title()}">EnderVault Bookmark Detail</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: jsOnlyNoscript}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('bookmarks')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section class="pathbar" aria-label="Bookmark detail location">
        <a class="button-link ghost icon-button"
           th:href="@{/files/bookmarks(directory=${currentBookmarkDirectoryId})}"
           title="Back to bookmarks" aria-label="Back to bookmarks">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </a>
        <span class="muted" th:text="${currentBookmarkDirectory != null ? currentBookmarkDirectory.title() : 'Bookmarks'}">Bookmarks</span>
    </section>

    <section class="detail-layout bookmark-detail-layout">
        <article class="detail-panel detail-main">
            <p class="eyebrow" th:text="${bookmark.typeLabel()}">Bookmark</p>
            <div class="bookmark-detail-title-row">
                <img class="bookmark-detail-favicon"
                     th:if="${bookmark.faviconAvailable()}"
                     th:src="@{/files/bookmarks/favicon(id=${bookmark.id()})}"
                     alt="">
                <i th:unless="${bookmark.faviconAvailable()}" th:class="${bookmark.iconClass()} + ' bookmark-detail-icon'" aria-hidden="true"></i>
                <h1 th:text="${bookmark.title()}">Bookmark title</h1>
            </div>

            <div class="detail-actions">
                <form class="row-form" method="post" th:action="@{/files/favorites/toggle-bookmark}"
                      data-favorite-action="toggle" th:attr="data-favorite-path=|bookmark:${bookmark.id()}|">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${bookmark.id()}">
                    <button class="ghost icon-button action-icon favorite-toggle" type="submit"
                            th:classappend="${favorite} ? ' is-favorite' : ''"
                            th:title="${favorite ? 'Remove from favorites' : 'Add to favorites'}"
                            th:attr="aria-label=${favorite ? 'Remove from favorites' : 'Add to favorites'}">
                        <i class="fas fa-star" aria-hidden="true"></i>
                    </button>
                </form>
                <a class="button-link icon-button" th:if="${bookmark.directory()}"
                   th:href="@{/files/bookmarks(directory=${bookmark.id()})}"
                   title="Open directory" aria-label="Open directory">
                    <i class="fas fa-folder-open" aria-hidden="true"></i>
                </a>
                <a class="button-link icon-text-button" th:if="${bookmark.link()}"
                   th:href="@{/files/bookmarks/open(id=${bookmark.id()})}"
                   target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
                    <span>Open link</span>
                </a>
            </div>

            <dl class="details bookmark-detail-info">
                <div>
                    <dt>ID</dt>
                    <dd th:text="${bookmark.id()}">id</dd>
                </div>
                <div>
                    <dt>Type</dt>
                    <dd th:text="${bookmark.typeLabel()}">type</dd>
                </div>
                <div>
                    <dt>Title</dt>
                    <dd th:text="${bookmark.title()}">title</dd>
                </div>
                <div th:if="${bookmark.link()}">
                    <dt>URL</dt>
                    <dd>
                        <a th:href="@{/files/bookmarks/open(id=${bookmark.id()})}"
                           th:text="${bookmark.safeUrl()}"
                           target="_blank" rel="noopener noreferrer">url</a>
                    </dd>
                </div>
                <div th:if="${bookmark.link()}">
                    <dt>Note</dt>
                    <dd th:text="${#strings.isEmpty(bookmark.safeNote()) ? '-' : bookmark.safeNote()}">note</dd>
                </div>
                <div th:if="${bookmark.link()}">
                    <dt>Title source</dt>
                    <dd th:text="${bookmark.effectiveTitleSource()}">source</dd>
                </div>
                <div th:if="${bookmark.link()}">
                    <dt>Metadata status</dt>
                    <dd th:text="${metadataFetchStatus}">status</dd>
                </div>
                <div th:if="${bookmark.link()}">
                    <dt>Metadata fetched</dt>
                    <dd th:text="${bookmark.metadataFetchedLabel()}">fetched</dd>
                </div>
                <div th:if="${bookmark.link()}">
                    <dt>Favicon</dt>
                    <dd th:text="${bookmark.faviconAvailable() ? bookmark.faviconContentType() : '-'}">favicon</dd>
                </div>
                <div>
                    <dt>Created</dt>
                    <dd th:text="${bookmark.createdLabel()}">created</dd>
                </div>
                <div>
                    <dt>Updated</dt>
                    <dd th:text="${bookmark.updatedLabel()}">updated</dd>
                </div>
                <div th:if="${bookmark.link()}">
                    <dt>Last opened</dt>
                    <dd th:text="${bookmark.lastOpenedLabel()}">last opened</dd>
                </div>
            </dl>
        </article>

        <aside class="detail-panel detail-manage">
            <h2>Manage</h2>
            <div class="manage-stack">
                <form th:if="${bookmark.directory()}" class="stack manage-form" method="post"
                      th:action="@{/files/bookmarks/directories/update}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${bookmark.id()}">
                    <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                    <input type="hidden" name="returnToDetail" value="true">
                    <label>
                        Directory name
                        <input type="text" name="title" maxlength="200" th:value="${bookmark.title()}" required>
                    </label>
                    <button type="submit">
                        <i class="fas fa-floppy-disk" aria-hidden="true"></i>
                        Save
                    </button>
                </form>

                <form th:if="${bookmark.link()}" class="stack manage-form" method="post"
                      th:action="@{/files/bookmarks/links/update}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${bookmark.id()}">
                    <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                    <input type="hidden" name="returnToDetail" value="true">
                    <label>
                        Title
                        <input type="text" name="title" maxlength="200" th:value="${bookmark.title()}"
                               placeholder="Leave blank to auto-name">
                    </label>
                    <label>
                        URL
                        <input type="text" name="url" maxlength="4096" th:value="${bookmark.safeUrl()}" required>
                    </label>
                    <label>
                        Note
                        <textarea name="note" rows="5" maxlength="1000" th:text="${bookmark.safeNote()}"></textarea>
                    </label>
                    <button type="submit">
                        <i class="fas fa-floppy-disk" aria-hidden="true"></i>
                        Save
                    </button>
                </form>

                <form th:if="${bookmarkMetadataFetchEnabled and bookmark.link() and bookmark.externalLink()}"
                      class="stack manage-form" method="post"
                      th:action="@{/files/bookmarks/metadata}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${bookmark.id()}">
                    <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                    <input type="hidden" name="returnToDetail" value="true">
                    <button class="ghost" type="submit">
                        <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
                        Refresh metadata
                    </button>
                </form>

                <div class="manage-delete">
                    <form class="row-form" method="post" th:action="@{/files/bookmarks/delete}"
                          onsubmit="return confirm('Delete this bookmark item?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="id" th:value="${bookmark.id()}">
                        <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                        <button class="danger icon-text-button" type="submit">
                            <i class="fas fa-trash-can" aria-hidden="true"></i>
                            Delete
                        </button>
                    </form>
                </div>
            </div>
        </aside>
    </section>
</main>
</div>
</div>
</body>
</html>
