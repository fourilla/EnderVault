<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${item.name()}">Shared File</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:if="${sharedPreviewEnabled and fileTool.text()}">
        <th:block th:replace="~{fragments/assets :: fileToolsScript}"></th:block>
    </th:block>
    <th:block th:if="${sharedPreviewEnabled and fileTool.image()}">
        <th:block th:replace="~{fragments/assets :: sharedImageScript}"></th:block>
    </th:block>
    <th:block th:if="${sharedPreviewEnabled and fileTool.comic()}">
        <th:block th:replace="~{fragments/assets :: sharedComicScript}"></th:block>
    </th:block>
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">EnderVault Share</a>
</header>

<main class="workspace">
    <section class="shared-summary">
        <header class="shared-file-header">
            <div class="shared-file-title">
                <p class="eyebrow">Shared file</p>
                <h1 th:text="${item.name()}">file</h1>
            </div>
            <a class="button-link shared-download-button" th:href="${sharedDownloadUrl}"
               title="Download" aria-label="Download">
                <i class="fas fa-download" aria-hidden="true"></i>
                <span>Download</span>
            </a>
        </header>

        <details class="shared-preview-panel" data-shared-preview th:if="${sharedPreviewEnabled}">
            <summary class="section-heading shared-preview-summary">
                <h2>Preview</h2>
                <span class="section-heading-actions">
                    <span class="status-badge" th:text="${fileTool.text() ? 'Text Preview' : fileTool.label()}">Preview</span>
                    <i class="fas fa-chevron-down shared-preview-chevron" aria-hidden="true"></i>
                </span>
            </summary>

            <div class="shared-preview-content">

                <div id="shared-image-root" th:if="${fileTool.image()}">
                    <img class="preview-media" data-shared-image-source
                         th:src="${sharedPreviewUrl}"
                         th:alt="${item.name()}">
                </div>

                <div class="preview-surface" th:if="${fileTool.video()}">
                    <video class="preview-media" controls preload="metadata"
                           th:src="${sharedPreviewUrl}"></video>
                </div>

                <div id="shared-comic-root" th:if="${fileTool.comic()}"
                     th:data-manifest-url="${sharedComicManifestUrl}">
                    <p class="tool-message" role="status">Loading comic...</p>
                </div>

                <th:block th:if="${fileTool.audio()}">
                    <th:block th:replace="~{fragments/file-tools/audio-tool :: player(
                            ${sharedPreviewUrl},
                            ${item.name()}
                    )}"></th:block>
                </th:block>

                <div class="shared-text-preview" th:if="${fileTool.text()}"
                     th:data-text-extension="${detail.extension()}"
                     th:data-text-name="${detail.name()}"
                     data-shared-text-preview>
                    <textarea class="shared-text-fallback text-editor-area"
                              th:if="${textContent.loaded()}"
                              data-shared-text-source
                              readonly
                              spellcheck="false"
                              th:text="${textContent.content()}">text</textarea>
                    <div class="tool-message" th:unless="${textContent.loaded()}">
                        <p th:text="${textContent.message()}">Text preview unavailable.</p>
                    </div>
                </div>
            </div>
        </details>

        <dl class="details shared-file-details">
            <div>
                <dt>Type</dt>
                <dd th:text="${item.mediaType()}">type</dd>
            </div>
            <div>
                <dt>Size</dt>
                <dd th:text="${item.sizeLabel()}">size</dd>
            </div>
            <div>
                <dt>Modified</dt>
                <dd th:text="${item.modifiedLabel()}">modified</dd>
            </div>
        </dl>
    </section>
</main>
</body>
</html>
