<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Account Settings</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: adminActionsScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace dashboard-workspace account-settings-workspace">
    <section th:replace="~{fragments/admin-shell :: pathbar('Account Settings', @{/admin/settings}, 'Back to settings')}"></section>

    <section class="dashboard-panel settings-detail-panel">
        <header class="section-heading">
            <div>
                <h2>Admin Account</h2>
                <p th:text="'Saved to ' + ${accountSettings.configPath()}">Saved to endervault-nas.properties</p>
            </div>
        </header>

        <form class="account-settings-form"
              method="post"
              th:action="@{/api/v1/settings/account}"
              data-ajax-action="account-settings-save">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="settings-actions-top">
                <button th:replace="~{fragments/settings :: saveButton}"></button>
            </div>

            <section class="settings-detail-section" aria-label="Admin credentials">
                <header class="settings-subsection-heading">
                    <div>
                        <h3>Credentials</h3>
                        <p>Changing the admin ID or password requires the current password.</p>
                    </div>
                </header>
                <div class="settings-field-grid">
                    <label>
                        <span>Admin ID</span>
                        <input name="username"
                               minlength="3"
                               maxlength="64"
                               autocomplete="username"
                               th:value="${accountSettings.username()}">
                    </label>
                    <label>
                        <span>Current password</span>
                        <div class="password-field">
                            <input type="password"
                                   name="currentPassword"
                                   autocomplete="current-password"
                                   data-password-toggle-input>
                            <button class="ghost icon-button password-toggle"
                                    type="button"
                                    title="Show current password"
                                    aria-label="Show current password"
                                    data-show-label="Show current password"
                                    data-hide-label="Hide current password"
                                    data-password-toggle>
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </label>
                    <label>
                        <span>New password</span>
                        <div class="password-field">
                            <input type="password"
                                   name="newPassword"
                                   minlength="4"
                                   autocomplete="new-password"
                                   data-password-toggle-input>
                            <button class="ghost icon-button password-toggle"
                                    type="button"
                                    title="Show new password"
                                    aria-label="Show new password"
                                    data-show-label="Show new password"
                                    data-hide-label="Hide new password"
                                    data-password-toggle>
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </label>
                    <label>
                        <span>Confirm new password</span>
                        <div class="password-field">
                            <input type="password"
                                   name="confirmPassword"
                                   minlength="4"
                                   autocomplete="new-password"
                                   data-password-toggle-input>
                            <button class="ghost icon-button password-toggle"
                                    type="button"
                                    title="Show confirmation password"
                                    aria-label="Show confirmation password"
                                    data-show-label="Show confirmation password"
                                    data-hide-label="Hide confirmation password"
                                    data-password-toggle>
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </label>
                </div>
            </section>

            <section class="settings-detail-section" aria-label="Password login policy">
                <header class="settings-subsection-heading">
                    <div>
                        <h3>ID/Password Login</h3>
                        <p>Disable this only after registering at least one passkey.</p>
                    </div>
                    <label class="settings-heading-switch">
                        <span id="accountPasswordLoginState"
                              class="status-badge"
                              th:classappend="${accountSettings.passwordLoginEnabled()} ? ' active' : ' expired'"
                              th:text="${accountSettings.passwordLoginEnabled()} ? 'Enabled' : 'Disabled'">Enabled</span>
                        <input class="settings-switch-input"
                               type="checkbox"
                               name="passwordLoginEnabled"
                               th:checked="${accountSettings.passwordLoginEnabled()}"
                               data-state-label="#accountPasswordLoginState"
                               data-on-label="Enabled"
                               data-off-label="Disabled"
                               data-on-class="active"
                               data-off-class="expired">
                    </label>
                </header>
                <div class="account-status-grid">
                    <article>
                        <span>Passkeys</span>
                        <strong th:text="${accountSettings.passkeysEnabled()} ? 'Enabled' : 'Disabled'">Enabled</strong>
                    </article>
                    <article>
                        <span>Registered passkeys</span>
                        <strong th:text="${accountSettings.passkeyCount()}">0</strong>
                    </article>
                    <article>
                        <span>ID/PW login</span>
                        <strong th:text="${accountSettings.passwordLoginEnabled()} ? 'Enabled' : 'Disabled'">Enabled</strong>
                    </article>
                </div>
            </section>
        </form>
    </section>
</main>
</div>
</div>
</body>
</html>
