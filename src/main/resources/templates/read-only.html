<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Read-only</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <script defer th:src="@{/js/read-only.js}"></script>
    <script defer th:src="@{/js/page-jump.js}"></script>
</head>
<body class="readonly-page">
<main class="workspace readonly-workspace">
    <section th:replace="~{fragments/breadcrumbs :: readOnly(${listing}, ${path})}"></section>

    <details class="readonly-sort-panel">
        <summary class="readonly-sort-toggle">
            <span class="readonly-sort-toggle-main">
                <i class="fas fa-arrow-down-wide-short" aria-hidden="true"></i>
                <span>View options</span>
            </span>
            <span class="readonly-sort-summary" th:text="|${sort} / ${dir} / ${filePage.size()} / ${hidden}|">name / asc / 50 / hide</span>
        </summary>
        <div class="readonly-sort-controls">
            <form class="readonly-sort-reset-anchor" id="readonlySortResetForm" method="post" th:action="@{/files/preferences/reset}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="target" value="read-only">
                <input type="hidden" name="path" th:value="${path}">
            </form>
            <form class="readonly-sortbar" method="get" th:action="@{/files/read-only}" aria-label="Read-only view options">
                <input type="hidden" name="path" th:value="${path}">
                <label>
                    <span>Sort</span>
                    <select name="sort">
                        <option value="name" th:selected="${sort == 'name'}">Name</option>
                        <option value="size" th:selected="${sort == 'size'}">Size</option>
                        <option value="modified" th:selected="${sort == 'modified'}">Modified</option>
                        <option value="type" th:selected="${sort == 'type'}">Type</option>
                    </select>
                </label>
                <label>
                    <span>Direction</span>
                    <select name="dir">
                        <option value="asc" th:selected="${dir == 'asc'}">Ascending</option>
                        <option value="desc" th:selected="${dir == 'desc'}">Descending</option>
                    </select>
                </label>
                <label>
                    <span>Page size</span>
                    <select name="size">
                        <option th:each="pageSize : ${pageSizes}"
                                th:value="${pageSize}"
                                th:text="${pageSize}"
                                th:selected="${pageSize == filePage.size()}">50</option>
                    </select>
                </label>
                <div class="readonly-sort-footer">
                    <label>
                        <span>Visibility</span>
                        <select name="hidden">
                            <option value="hide" th:selected="${hidden == 'hide'}">Visible only</option>
                            <option value="show" th:selected="${hidden == 'show'}">Show hidden</option>
                        </select>
                    </label>
                    <div class="readonly-sort-buttons">
                        <button class="ghost icon-button" form="readonlySortResetForm" type="submit" title="Reset view options"
                                aria-label="Reset view options">
                            <i class="fas fa-rotate-left" aria-hidden="true"></i>
                        </button>
                        <button class="icon-button" type="submit" title="Apply view options" aria-label="Apply view options">
                            <i class="fas fa-check" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </details>

    <section class="readonly-section" th:if="${not #lists.isEmpty(listing.directories())}" aria-label="Directories">
        <header class="section-heading">
            <h2 th:text="|Directories (${#lists.size(listing.directories())})|">Directories</h2>
        </header>
        <div class="table-wrap readonly-table">
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th class="readonly-date-col">Modified</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="directory : ${listing.directories()}"
                    th:classappend="${directory.hidden()} ? 'is-hidden-item' : ''">
                    <td>
                        <a class="item-name directory"
                           th:href="@{/files/read-only(path=${directory.path()})}">
                            <i class="fas fa-folder item-icon" aria-hidden="true"></i>
                            <span th:text="${directory.name()}">directory</span>
                        </a>
                        <span class="status-badge expired hidden-badge" th:if="${directory.hidden()}">Hidden</span>
                    </td>
                    <td class="readonly-date-col" th:text="${directory.modifiedLabel()}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="readonly-section" th:if="${filePage.totalItems() > 0}" aria-label="Files">
        <header class="section-heading">
            <h2 th:text="|Files (${filePage.totalItems()})|">Files</h2>
            <p th:text="|Showing ${filePage.startItem()}-${filePage.endItem()}|">Showing 1-50</p>
        </header>

        <div class="readonly-file-grid">
            <article class="readonly-file-card" th:each="file : ${filePage.items()}"
                     th:classappend="${file.hidden()} ? 'is-hidden-item' : ''">
                <span class="status-badge expired hidden-badge card-hidden-badge" th:if="${file.hidden()}">Hidden</span>
                <a class="readonly-file-link"
                   th:href="${filePreview.openUrl(file)}">
                    <span class="readonly-thumb">
                        <img class="thumb-media" th:if="${file.image()}" loading="lazy"
                             th:src="${filePreview.cardMediaUrl(file)}"
                             th:alt="${file.name()}">
                        <span class="video-thumb-wrap" th:if="${file.video() or file.comic() or file.pdf()}">
                            <img class="thumb-media" loading="lazy"
                                 th:src="${filePreview.cardMediaUrl(file)}"
                                 th:alt="${file.name()}">
                        </span>
                        <span class="thumb-extension"
                              th:classappend="${file.image() or file.video() or file.comic() or file.pdf()} ? ' thumb-extension-overlay' : ' thumb-extension-center'"
                              th:text="${file.extensionLabel()}">FILE</span>
                    </span>
                    <span class="readonly-file-name" th:title="${file.name()}" th:text="${file.name()}">file</span>
                </a>
            </article>
        </div>

        <nav class="pagination" th:if="${filePage.totalPages() > 1}" aria-label="File pages">
            <a class="ghost pagination-link" th:if="${filePage.hasPrevious()}"
               th:href="@{/files/read-only(path=${path}, page=1)}">First</a>
            <span class="ghost pagination-link disabled" th:unless="${filePage.hasPrevious()}">First</span>
            <a class="ghost pagination-link" th:if="${filePage.hasPrevious()}"
               th:href="@{/files/read-only(path=${path}, page=${filePage.previousPage()})}">Previous</a>
            <span class="ghost pagination-link disabled" th:unless="${filePage.hasPrevious()}">Previous</span>
            <span class="page-status"
                  data-page-jump
                  data-page-param="page"
                  th:attr="data-page-current=${filePage.page()},data-page-total=${filePage.totalPages()}"
                  th:text="|Page ${filePage.page()} of ${filePage.totalPages()}|">Page 1 of 1</span>
            <a class="ghost pagination-link" th:if="${filePage.hasNext()}"
               th:href="@{/files/read-only(path=${path}, page=${filePage.nextPage()})}">Next</a>
            <span class="ghost pagination-link disabled" th:unless="${filePage.hasNext()}">Next</span>
            <a class="ghost pagination-link" th:if="${filePage.hasNext()}"
               th:href="@{/files/read-only(path=${path}, page=${filePage.totalPages()})}">Last</a>
            <span class="ghost pagination-link disabled" th:unless="${filePage.hasNext()}">Last</span>
        </nav>
    </section>

    <p th:if="${#lists.isEmpty(listing.directories()) and filePage.totalItems() == 0}"
       class="empty browser-grid-empty">This directory is empty.</p>
</main>
</body>
</html>
