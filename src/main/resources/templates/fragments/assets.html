<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="styles(fontawesome)">
    <link rel="stylesheet" th:if="${fontawesome}"
          th:href="@{/webjars/fortawesome__fontawesome-free/6.7.2/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</th:block>

<th:block th:fragment="jsOnlyNoscript">
    <noscript>
        <style>.js-only { display: none !important; }</style>
    </noscript>
</th:block>

<th:block th:fragment="coreScripts">
    <meta th:if="${#ctx.containsVariable('taskUiConfig')}"
          name="endervault-task-activity-enabled"
          th:content="${taskUiConfig.activityPanelEnabled()}">
    <meta th:if="${#ctx.containsVariable('taskUiConfig')}"
          name="endervault-task-completed-display-ms"
          th:content="${taskUiConfig.completedDisplayMs()}">
    <meta th:if="${#ctx.containsVariable('taskUiConfig')}"
          name="endervault-task-failed-display-ms"
          th:content="${taskUiConfig.failedDisplayMs()}">
    <meta th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
          name="endervault-sticky-target-type" th:content="${stickyNoteContext.targetType()}">
    <meta th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
          name="endervault-sticky-target-key" th:content="${stickyNoteContext.targetKey()}">
    <meta th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
          name="endervault-sticky-surface" th:content="${stickyNoteContext.surface()}">
    <meta th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
          name="endervault-sticky-label" th:content="${stickyNoteContext.label()}">
    <script defer th:src="@{/js/endervault-core.js}"></script>
    <script defer th:src="@{/js/context-menu.js}"></script>
    <script defer th:src="@{/js/password-toggle.js}"></script>
    <script defer th:src="@{/js/notifications.js}"></script>
    <script defer th:src="@{/js/activity-panel.js}"></script>
    <script defer th:src="@{/js/server-tasks.js}"></script>
    <script defer th:src="@{/js/favorites.js}"></script>
    <script defer th:src="@{/js/outbound-route.js}"></script>
    <script defer th:src="@{/js/sticky-notes.js}"></script>
</th:block>

<th:block th:fragment="adminActionsScript">
    <script defer th:src="@{/js/admin-actions.js}"></script>
</th:block>

<th:block th:fragment="metadataScript">
    <script defer th:src="@{/js/metadata.js}"></script>
</th:block>

<th:block th:fragment="fileToolbarScript">
    <script defer th:src="@{/js/file-browser-refresh.js}"></script>
    <script defer th:src="@{/js/file-uploads.js}"></script>
    <script defer th:src="@{/js/file-selection.js}"></script>
    <script defer th:src="@{/js/file-actions.js}"></script>
    <script defer th:src="@{/js/file-transfer-buffer.js}"></script>
    <script defer th:src="@{/js/file-context-menu.js}"></script>
</th:block>

<th:block th:fragment="selectionScript">
    <script defer th:src="@{/js/file-selection.js}"></script>
</th:block>

<th:block th:fragment="bookmarkScript">
    <script defer th:src="@{/js/file-browser-refresh.js}"></script>
    <script defer th:src="@{/js/bookmark-actions.js}"></script>
    <script defer th:src="@{/js/bookmark-context-menu.js}"></script>
</th:block>

<th:block th:fragment="transferBufferScript">
    <script defer th:src="@{/js/file-transfer-buffer.js}"></script>
</th:block>

<th:block th:fragment="markdownRendererScript">
    <link rel="stylesheet" th:href="@{/webjars/highlightjs/11.11.1/styles/github-dark.min.css}">
    <script defer th:src="@{/webjars/markdown-it/14.3.0/dist/markdown-it.min.js}"></script>
    <script defer th:src="@{/webjars/markdown-it-task-lists/2.1.1/dist/markdown-it-task-lists.min.js}"></script>
    <script defer th:src="@{/webjars/markdown-it-footnote/2.0.0/dist/markdown-it-footnote.min.js}"></script>
    <script defer th:src="@{/webjars/dompurify/3.4.11/dist/purify.min.js}"></script>
    <script defer th:src="@{/webjars/highlightjs/11.11.1/highlight.js}"></script>
    <script defer th:src="@{/webjars/mermaid/11.15.0/dist/mermaid.min.js}"></script>
    <script defer th:src="@{/js/markdown-math-plugin.js}"></script>
    <script defer th:src="@{/js/mathjax-config.js}"></script>
    <script defer th:src="@{/_static/mathjax/4.1.1/tex-chtml.js}"></script>
    <script defer th:src="@{/js/markdown-renderer.js}"></script>
</th:block>

<th:block th:fragment="fileToolsScript">
    <link rel="stylesheet" th:href="@{/webjars/codemirror/5.65.19/lib/codemirror.css}">
    <link rel="stylesheet" th:href="@{/webjars/codemirror/5.65.19/theme/material-darker.css}">
    <link rel="stylesheet" th:href="@{/webjars/codemirror/5.65.19/addon/dialog/dialog.css}">
    <script defer th:src="@{/webjars/codemirror/5.65.19/lib/codemirror.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/addon/mode/simple.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/xml/xml.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/javascript/javascript.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/css/css.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/htmlmixed/htmlmixed.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/markdown/markdown.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/clike/clike.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/python/python.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/shell/shell.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/properties/properties.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/yaml/yaml.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/sql/sql.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/powershell/powershell.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/ruby/ruby.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/go/go.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/rust/rust.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/php/php.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/dockerfile/dockerfile.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/mode/toml/toml.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/addon/selection/active-line.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/addon/edit/matchbrackets.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/addon/edit/closebrackets.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/addon/search/searchcursor.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/addon/dialog/dialog.js}"></script>
    <script defer th:src="@{/webjars/codemirror/5.65.19/addon/search/search.js}"></script>
    <script defer th:src="@{/js/file-tools.js}"></script>
</th:block>

<th:block th:fragment="comicViewerScript">
    <script defer th:src="@{/js/comic-viewer.js}"></script>
</th:block>

<th:block th:fragment="remoteDownloadScript">
    <script defer th:src="@{/js/remote-download.js}"></script>
</th:block>

<th:block th:fragment="vpnStatusScript">
    <script defer th:src="@{/js/vpn-status.js}"></script>
</th:block>

<th:block th:fragment="logsScript">
    <script defer th:src="@{/js/logs.js}"></script>
</th:block>

<th:block th:fragment="passkeyScript">
    <script defer th:src="@{/js/passkeys.js}"></script>
</th:block>
</body>
</html>
