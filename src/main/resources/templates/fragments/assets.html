<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="styles(fontawesome)">
    <link rel="stylesheet" th:if="${fontawesome}"
          th:href="@{/webjars/fortawesome__fontawesome-free/6.7.2/css/all.min.css}">
    <link rel="stylesheet" th:if="${!stylesFrontend.available()}" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:each="style : ${stylesFrontend.styles()}" th:href="${style}">
    <link rel="modulepreload" th:each="preload : ${stylesFrontend.modulePreloads()}" th:href="${preload}">
    <script type="module" th:if="${stylesFrontend.development()}" th:src="${stylesFrontend.clientScript()}"></script>
    <script type="module" th:if="${stylesFrontend.development()}" th:src="${stylesFrontend.entryScript()}"></script>
    <style th:if="${#ctx.containsVariable('stickyNoteTheme')}"
           th:text="|:root { --sticky-note-bg: ${stickyNoteTheme.backgroundColor()}; --sticky-note-border: ${stickyNoteTheme.borderColor()}; --sticky-note-text: ${stickyNoteTheme.textColor()}; }|">
        :root { --sticky-note-bg: #1B3033; --sticky-note-border: #4E8F8A; --sticky-note-text: #EAF6F4; }
    </style>
</th:block>

<th:block th:fragment="jsOnlyNoscript">
    <noscript>
        <style>.js-only { display: none !important; }</style>
    </noscript>
</th:block>

<th:block th:fragment="coreScripts">
    <meta th:if="${#ctx.containsVariable('taskUiConfig')}"
          name="endervault-task-activity-enabled"
          th:content="${taskUiConfig.activityPanelEnabled()}">
    <meta th:if="${#ctx.containsVariable('taskUiConfig')}"
          name="endervault-task-completed-display-ms"
          th:content="${taskUiConfig.completedDisplayMs()}">
    <meta th:if="${#ctx.containsVariable('taskUiConfig')}"
          name="endervault-task-failed-display-ms"
          th:content="${taskUiConfig.failedDisplayMs()}">
    <meta th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
          name="endervault-sticky-target-type" th:content="${stickyNoteContext.targetType()}">
    <meta th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
          name="endervault-sticky-target-key" th:content="${stickyNoteContext.targetKey()}">
    <meta th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
          name="endervault-sticky-surface" th:content="${stickyNoteContext.surface()}">
    <meta th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
          name="endervault-sticky-label" th:content="${stickyNoteContext.label()}">
    <th:block th:if="${shellFrontend.available()}"
              th:replace="~{fragments/assets :: viteEntry(${shellFrontend})}"></th:block>
    <th:block th:unless="${shellFrontend.available()}">
        <script defer th:src="@{/js/endervault-core.js}"></script>
        <script defer th:src="@{/js/context-menu.js}"></script>
        <script defer th:src="@{/js/password-toggle.js}"></script>
        <script defer th:src="@{/js/notifications.js}"></script>
        <script defer th:src="@{/js/activity-panel.js}"></script>
        <script defer th:src="@{/js/server-tasks.js}"></script>
        <script defer th:src="@{/js/favorites.js}"></script>
        <script defer th:src="@{/js/topbar-controls.js}"></script>
        <script defer th:src="@{/js/notification-center.js}"></script>
        <script defer th:src="@{/js/outbound-route.js}"></script>
        <script defer th:src="@{/js/sticky-notes.js}"></script>
        <script defer th:src="@{/js/page-context-menu.js}"></script>
    </th:block>
</th:block>

<th:block th:fragment="adminActionsScript">
    <script defer th:src="@{/js/admin-actions.js}"></script>
</th:block>

<th:block th:fragment="viteEntry(entry)">
    <link rel="stylesheet" th:each="style : ${entry.styles()}" th:href="${style}">
    <link rel="modulepreload" th:each="preload : ${entry.modulePreloads()}" th:href="${preload}">
    <script type="module" th:if="${entry.development()}" th:src="${entry.clientScript()}"></script>
    <script type="module" th:if="${entry.available()}" th:src="${entry.entryScript()}"></script>
</th:block>

<th:block th:fragment="resumableUploadScript">
    <script defer th:src="@{/webjars/tus-js-client/4.3.1/dist/tus.min.js}"></script>
    <script defer th:src="@{/js/resumable-upload-client.js}"></script>
</th:block>

<th:block th:fragment="selectionScript">
    <script defer th:src="@{/js/file-selection.js}"></script>
</th:block>

<th:block th:fragment="markdownRendererScript">
    <th:block th:if="${markdownFrontend.available()}"
              th:replace="~{fragments/assets :: viteEntry(${markdownFrontend})}"></th:block>
</th:block>

<th:block th:fragment="fileToolsScript">
    <th:block th:if="${fileToolsFrontend.available()}"
              th:replace="~{fragments/assets :: viteEntry(${fileToolsFrontend})}"></th:block>
</th:block>

<th:block th:fragment="remoteDownloadScript">
    <script defer th:src="@{/js/directory-tree.js}"></script>
    <script defer th:src="@{/js/directory-picker.js}"></script>
    <script defer th:src="@{/js/remote-download-curl.js}"></script>
    <script defer th:src="@{/js/remote-download.js}"></script>
</th:block>

<th:block th:fragment="directoryPickerScript">
    <script defer th:src="@{/js/directory-tree.js}"></script>
    <script defer th:src="@{/js/directory-picker.js}"></script>
</th:block>

<th:block th:fragment="passkeyScript">
    <script defer th:src="@{/js/passkeys.js}"></script>
</th:block>
</body>
</html>
