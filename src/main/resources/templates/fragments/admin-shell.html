<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="sidebar-brand" th:href="@{/files}">EnderVault</a>
    <nav class="sidebar-nav" aria-label="Primary navigation">
        <a th:classappend="${active == 'dashboard'} ? ' active' : ''" th:href="@{/admin/dashboard}">
            <i class="fas fa-gauge-high" aria-hidden="true"></i>
            <span>Dashboard</span>
        </a>
        <a th:classappend="${active == 'files'} ? ' active' : ''" th:href="@{/files}">
            <i class="fas fa-folder" aria-hidden="true"></i>
            <span>Files</span>
        </a>
        <a th:classappend="${active == 'recent'} ? ' active' : ''" th:href="@{/files/recent}">
            <i class="fas fa-clock" aria-hidden="true"></i>
            <span>Recent</span>
        </a>
        <a th:classappend="${active == 'bookmarks'} ? ' active' : ''" th:href="@{/files/bookmarks}">
            <i class="fas fa-bookmark" aria-hidden="true"></i>
            <span>Bookmarks</span>
        </a>
    </nav>

    <div class="sidebar-favorites-shell">
        <details class="sidebar-favorites" open>
            <summary>
                <i class="fas fa-star" aria-hidden="true"></i>
                <span>Favorites</span>
            </summary>
            <div class="sidebar-favorites-list" data-sidebar-favorites-list>
                <a th:each="favorite : ${favorites}"
                   th:classappend="${favorite.hidden()} ? 'is-hidden-item' : ''"
                   th:href="${favorite.openUrl(bookmarkLinkClickAction)}"
                   th:title="${favorite.targetLabel()}"
                   th:target="${favorite.opensInNewTab(bookmarkLinkClickAction)} ? '_blank' : null"
                   th:rel="${favorite.opensInNewTab(bookmarkLinkClickAction)} ? 'noopener noreferrer' : null"
                   th:attr="data-favorite-sidebar-path=${favorite.path()},
                            data-favorite-direct-open-url=${favorite.directOpenUrl()},
                            data-favorite-detail-url=${favorite.detailUrl()},
                            data-favorite-bookmark-link=${favorite.bookmarkLink()}">
                    <i th:class="${favorite.iconClass()}" aria-hidden="true"></i>
                    <span th:text="${favorite.name()}">favorite</span>
                </a>
            </div>
            <p th:if="${#lists.isEmpty(favorites)}" data-sidebar-favorites-empty>No favorites yet.</p>
        </details>
        <a class="ghost icon-button action-icon sidebar-favorites-edit"
           th:classappend="${active == 'favorites'} ? ' active' : ''"
           th:href="@{/files/favorites}"
           title="Manage favorites" aria-label="Manage favorites">
            <i class="fas fa-pen-to-square" aria-hidden="true"></i>
        </a>
    </div>

    <section class="sidebar-usage" th:if="${storageUsage != null}" aria-label="Disk usage">
        <p>Disk usage</p>
        <strong th:text="|${storageUsage.usedLabel()} / ${storageUsage.totalLabel()}|">0 B / 0 B</strong>
        <span th:text="|${storageUsage.usedPercent()}% used / ${storageUsage.usableLabel()} free|">0% used / 0 B free</span>
    </section>
</aside>

<header class="topbar app-topbar" th:fragment="topbar">
    <div class="topbar-actions">
        <div class="sticky-note-controls"
             th:if="${#ctx.containsVariable('stickyNoteContext') and stickyNoteContext.available()}"
             data-sticky-note-controls hidden>
            <button class="ghost icon-button sticky-note-visibility-toggle" type="button"
                    data-sticky-note-visibility title="Hide sticky notes" aria-label="Hide sticky notes"
                    aria-pressed="true" aria-haspopup="menu">
                <i class="fas fa-note-sticky" aria-hidden="true"></i>
            </button>
            <div class="sticky-note-topbar-popover">
                <div class="sticky-note-topbar-menu" role="menu" aria-label="Sticky note actions">
                    <button class="ghost icon-text-button" type="button" role="menuitem" data-sticky-note-add>
                        <i class="fas fa-plus" aria-hidden="true"></i>
                        <span>New sticky note</span>
                    </button>
                </div>
            </div>
        </div>
        <form class="topbar-route-form"
              method="post"
              th:action="@{/admin/outbound/route}"
              data-outbound-route-form>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="route" th:value="${outboundRoute.nextRoute()}" data-outbound-route-input>
            <button class="ghost icon-button topbar-route-toggle"
                    th:classappend="| route-${outboundRoute.statusClass()}|"
                    type="submit"
                    th:title="${outboundRoute.title()}"
                    th:attr="aria-label=${outboundRoute.title()}"
                    data-outbound-route-toggle>
                <i th:class="${outboundRoute.iconClass()}" aria-hidden="true" data-outbound-route-icon></i>
            </button>
        </form>
        <a class="ghost icon-button topbar-readonly" th:href="@{/files/read-only(path=${path})}" title="Open read-only mode"
           aria-label="Open read-only mode">
            <i class="fas fa-mobile-screen-button" aria-hidden="true"></i>
        </a>
    </div>
    <form method="post" th:action="@{/logout}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="ghost icon-button" type="submit" title="Log out" aria-label="Log out">
            <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
        </button>
    </form>
</header>

<section class="pathbar" th:fragment="pathbar(title, backHref, backLabel)">
    <a class="ghost icon-button" th:href="${backHref}" th:title="${backLabel}" th:attr="aria-label=${backLabel}">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
    </a>
    <div class="pathbar-title-group">
        <h1 th:text="${title}">Page</h1>
    </div>
</section>
</body>
</html>
