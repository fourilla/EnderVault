<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th class="select-col" th:fragment="selectHeader(label)">
    <span data-select-pick-label>Pick</span>
    <label class="select-all-label js-only" th:title="${label}">
        <input class="select-all-checkbox" type="checkbox" data-select-all
               th:attr="aria-label=${label}">
    </label>
</th>
</body>
</html>
