<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="tool" th:if="${fileTool.archive()}">
    <div class="archive-tool"
         data-archive-tool
         th:attr="data-entries-url=@{/api/v1/fs/archive/entries(path=${detail.path()})}">
        <div class="archive-summary" aria-live="polite">
            <span><strong data-archive-format>Archive</strong></span>
            <span><strong data-archive-files>-</strong> files</span>
            <span><strong data-archive-directories>-</strong> directories</span>
            <span><strong data-archive-size>-</strong> unpacked</span>
        </div>

        <p class="archive-status muted js-only" data-archive-status>Loading archive entries...</p>
        <div class="archive-tree js-only" data-archive-tree></div>
        <noscript>
            <p class="tool-message">Archive entry browsing requires JavaScript. The whole archive can still be extracted.</p>
        </noscript>

        <form class="archive-extract-form" method="post" th:action="@{/files/detail/archive/extract}"
              data-archive-extract-form>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="path" th:value="${detail.path()}">
            <div class="archive-layout-options">
                <label class="archive-container-option">
                    <input type="checkbox" name="createContainingDirectory" value="true" checked
                           data-archive-container-toggle>
                    <span>
                        <strong>Create containing directory</strong>
                        <small class="muted" data-archive-layout-hint>
                            Recommended automatically from the archive's top-level items.
                        </small>
                    </span>
                </label>
                <label class="archive-container-name-field" data-archive-container-name-field>
                    <span>Output directory name</span>
                    <input type="text" name="outputName" required maxlength="255"
                           th:value="${archiveSuggestedName}" data-archive-container-name>
                </label>
            </div>
            <label class="archive-destination-field">
                <span>Destination</span>
                <span class="input-action-field">
                    <input id="archiveDestinationPath" type="text" name="destinationPath"
                           th:value="${archiveDestinationPath}" placeholder="Vault root">
                    <button class="input-action-button js-only" type="button"
                            data-directory-picker-open data-directory-picker-target="archiveDestinationPath"
                            title="Browse directories" aria-label="Browse directories">
                        <i class="fas fa-folder-open" aria-hidden="true"></i>
                    </button>
                </span>
            </label>
            <label class="archive-conflict-field">
                <span>If an output item exists</span>
                <select name="conflictPolicy">
                    <option value="cancel">Cancel</option>
                    <option value="rename">Rename and continue</option>
                </select>
            </label>
            <div class="archive-extract-actions">
                <button type="submit" data-archive-extract-submit>
                    <i class="fas fa-box-open" aria-hidden="true"></i>
                    Extract Archive
                </button>
            </div>
        </form>
    </div>

    <th:block th:replace="~{fragments/directory-picker :: dialog}"></th:block>
</th:block>
</body>
</html>
