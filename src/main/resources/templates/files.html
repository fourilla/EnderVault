<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>EnderVault Files</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <script defer th:src="@{/webjars/tus-js-client/4.3.1/dist/tus.min.js}"></script>
    <script defer th:src="@{/js/resumable-upload-client.js}"></script>
    <th:block th:replace="~{fragments/assets :: viteEntry(${filesFrontend})}"></th:block>
    <script defer th:src="@{/js/file-uploads.js}"></script>
</head>
<body data-server-task-activity="true">
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('files')}"></aside>
<div class="app-main" data-file-dropzone>
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <div id="files-root" class="files-react-root"
         th:data-max-concurrent-uploads="${uploadUiConfig.maxConcurrentUploads()}"
         th:data-file-requests-enabled="${fileRequestsEnabled}">
        <section class="dashboard-panel settings-react-loading" th:if="${filesFrontend.available()}">
            Loading files...
        </section>
        <section class="dashboard-panel" th:unless="${filesFrontend.available()}">
            <header class="section-heading">
                <div>
                    <h2>Files frontend unavailable</h2>
                    <p>Build the frontend assets or start the configured Vite development server.</p>
                </div>
            </header>
        </section>
    </div>
</main>
</div>
</div>
</body>
</html>
