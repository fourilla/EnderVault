<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Shared Links</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: jsOnlyNoscript}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: adminActionsScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('shares')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section class="pathbar">
        <a class="ghost icon-button" th:href="@{/admin/dashboard}" title="Back to dashboard" aria-label="Back to dashboard">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </a>
        <div class="pathbar-title-group">
            <h1>Shared Links</h1>
            <form class="row-form" method="post" th:action="@{/api/v1/shares/expired/delete}" th:if="${not #lists.isEmpty(shares)}"
                  data-ajax-action="share-delete-expired">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="ghost" type="submit">Delete expired links</button>
            </form>
        </div>
    </section>

    <section class="table-wrap" aria-label="Shared links">
        <table>
            <thead>
            <tr>
                <th>Link</th>
                <th>Target</th>
                <th>Type</th>
                <th>Created</th>
                <th>Expires</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="share : ${shares}"
                th:attr="data-share-token=${share.token()},data-share-status=${share.statusClass()}">
                <td>
                    <input readonly th:value="${share.url()}">
                </td>
                <td>
                    <span class="item-name" th:title="${share.path()}" th:text="${share.path()}">path</span>
                </td>
                <td th:text="${share.type()}">FILE</td>
                <td th:text="${share.createdLabel()}">created</td>
                <td th:text="${share.expiresLabel()}">expires</td>
                <td>
                    <span class="status-badge" th:classappend="${share.statusClass()}" th:text="${share.statusLabel()}">Active</span>
                </td>
                <td>
                    <div class="table-actions">
                        <button class="ghost icon-button action-icon js-only" type="button"
                                title="Copy link" aria-label="Copy link"
                                th:attr="data-copy-value=${share.url()},data-copy-success='Share link copied.'">
                            <i class="fas fa-link" aria-hidden="true"></i>
                        </button>
                        <button class="ghost icon-button action-icon js-only" type="button"
                                th:if="${share.hasDirectDownloadUrl()}"
                                title="Copy direct download link" aria-label="Copy direct download link"
                                th:attr="data-copy-value=${share.directDownloadUrl()},data-copy-success='Direct download link copied.'">
                            <i class="fas fa-file-arrow-down" aria-hidden="true"></i>
                        </button>
                        <form class="row-form" method="post" th:action="@{/api/v1/shares/revoke}" th:if="${share.active()}"
                              data-ajax-action="share-revoke">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="token" th:value="${share.token()}">
                            <button class="danger icon-button action-icon" type="submit" title="Revoke" aria-label="Revoke">
                                <i class="fas fa-link-slash" aria-hidden="true"></i>
                            </button>
                        </form>
                        <form class="row-form" method="post" th:action="@{/api/v1/shares/delete}"
                              data-ajax-action="share-delete">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="token" th:value="${share.token()}">
                            <button class="ghost icon-button action-icon" type="submit" title="Delete" aria-label="Delete">
                                <i class="fas fa-trash-can" aria-hidden="true"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr class="empty-row" th:if="${#lists.isEmpty(shares)}">
                <td colspan="7" class="empty">No shared links yet.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</div>
</div>
</body>
</html>
