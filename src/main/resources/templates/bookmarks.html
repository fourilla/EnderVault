<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Bookmarks</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: jsOnlyNoscript}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: adminActionsScript}"></th:block>
    <th:block th:replace="~{fragments/assets :: selectionScript}"></th:block>
    <th:block th:replace="~{fragments/assets :: bookmarkScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('bookmarks')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section th:replace="~{fragments/breadcrumbs :: bookmarks(${bookmarkBreadcrumbs})}"></section>

    <section class="toolbar" aria-label="Bookmark tools">
        <form class="bulk-action-anchor" id="bulkActionForm" method="post"
              th:attr="data-bookmark-delete-selected-url=@{/files/bookmarks/delete-selected}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
            <input type="hidden" name="q" th:value="${query}">
        </form>

        <form class="search-form" method="get" th:action="@{/files/bookmarks}">
            <input type="hidden" name="directory" th:value="${currentBookmarkDirectoryId}">
            <label class="search-field">
                <span class="visually-hidden">Search bookmarks</span>
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                <input name="q" th:value="${query}" placeholder="Search bookmarks" autocomplete="off">
            </label>
            <button class="icon-button" type="submit" title="Search bookmarks" aria-label="Search bookmarks">
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
            </button>
        </form>

        <div class="toolbar-cluster" aria-label="Bookmark controls">
            <div class="toolbar-actions file-actions bookmark-actions" aria-label="Bookmark actions">
                <form hidden id="createBookmarkDirectoryForm" method="post" th:action="@{/files/bookmarks/directories}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                    <input id="newBookmarkDirectoryNameInput" type="hidden" name="title" disabled>
                </form>

                <button class="icon-button js-only" id="createBookmarkDirectoryButton" type="button"
                        title="New directory" aria-label="New directory">
                    <i class="fas fa-folder-plus" aria-hidden="true"></i>
                </button>
                <button class="icon-button js-only" id="createBookmarkLinkButton" type="button"
                        title="Add link" aria-label="Add link">
                    <i class="fas fa-link" aria-hidden="true"></i>
                </button>
                <button class="icon-button js-only" id="bulkAddBookmarksButton" type="button"
                        title="Bulk add links" aria-label="Bulk add links">
                    <i class="fas fa-list-ul" aria-hidden="true"></i>
                </button>

                <noscript>
                    <details class="settings-menu bookmark-tool-menu">
                        <summary class="icon-button menu-summary" title="Create bookmark items" aria-label="Create bookmark items">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                        </summary>
                        <div class="settings-panel bookmark-form-panel bookmark-noscript-panel">
                            <form class="settings-form bookmark-create-form" method="post" th:action="@{/files/bookmarks/directories}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                                <label>Directory name<input type="text" name="title" maxlength="200" required></label>
                                <button type="submit">Create directory</button>
                            </form>
                            <form class="settings-form bookmark-create-form" method="post" th:action="@{/files/bookmarks/links}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                                <label>Title<input type="text" name="title" maxlength="200" placeholder="Leave blank to auto-name"></label>
                                <label>URL<input type="text" name="url" maxlength="4096" placeholder="https://example.com or /files" required></label>
                                <button type="submit">Add link</button>
                            </form>
                            <form class="settings-form bookmark-create-form" method="post" th:action="@{/files/bookmarks/bulk}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                                <label>
                                    URLs or title / URL pairs
                                    <textarea name="bulkText" rows="12"
                                              placeholder="https://example.com/auto-name&#10;Title one&#10;https://example.com/one"
                                              required></textarea>
                                </label>
                                <button type="submit">Add links</button>
                            </form>
                        </div>
                    </details>
                </noscript>
                <button class="icon-button danger" id="deleteSelectedButton" form="bulkActionForm" type="submit"
                        th:formaction="@{/files/bookmarks/delete-selected}" formmethod="post"
                        title="Delete selected" aria-label="Delete selected">
                    <i class="fas fa-trash-can" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </section>

    <dialog class="text-input-dialog bookmark-form-dialog" id="bookmarkLinkDialog">
        <form class="text-input-card bookmark-dialog-card" id="createBookmarkLinkForm"
              method="post" th:action="@{/files/bookmarks/links}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
            <header class="text-input-header">
                <div>
                    <h2>Add link</h2>
                    <p>Save a URL in the current bookmark directory.</p>
                </div>
                <button class="ghost icon-button action-icon" type="button" data-bookmark-dialog-close
                        title="Cancel" aria-label="Cancel">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </header>
            <div class="bookmark-dialog-fields">
                <label class="text-input-field">
                    Title
                    <input type="text" name="title" maxlength="200" placeholder="Leave blank to auto-name">
                </label>
                <label class="text-input-field">
                    URL
                    <input type="text" name="url" maxlength="4096" placeholder="https://example.com or /files" required>
                </label>
            </div>
            <div class="text-input-actions">
                <button class="ghost icon-text-button" type="button" data-bookmark-dialog-close>Cancel</button>
                <button class="primary icon-text-button" type="submit">Add link</button>
            </div>
        </form>
    </dialog>

    <dialog class="text-input-dialog bookmark-form-dialog bookmark-bulk-dialog" id="bookmarkBulkAddDialog">
        <form class="text-input-card bookmark-dialog-card" id="bookmarkBulkAddForm"
              method="post" th:action="@{/files/bookmarks/bulk}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
            <header class="text-input-header">
                <div>
                    <h2>Bulk add links</h2>
                    <p>Enter URLs or title and URL pairs, one value per line.</p>
                </div>
                <button class="ghost icon-button action-icon" type="button" data-bookmark-dialog-close
                        title="Cancel" aria-label="Cancel">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </header>
            <label class="text-input-field">
                Links
                <textarea name="bulkText" rows="14"
                          placeholder="https://example.com/auto-name&#10;Title one&#10;https://example.com/one&#10;https://example.com/another-auto"
                          required></textarea>
            </label>
            <div class="text-input-actions">
                <button class="ghost icon-text-button" type="button" data-bookmark-dialog-close>Cancel</button>
                <button class="primary icon-text-button" type="submit">Add links</button>
            </div>
        </form>
    </dialog>

    <section class="browser-section bookmarks-panel" th:if="${not #lists.isEmpty(bookmarkDirectories)}" aria-label="Bookmark directories">
        <header class="section-heading">
            <h2 th:text="|Directories (${#lists.size(bookmarkDirectories)})|">Directories</h2>
        </header>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th th:replace="~{fragments/tables :: selectHeader('Select all bookmark directories in this table')}"></th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Updated</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="directory : ${bookmarkDirectories}"
                    data-bookmark-context-item="true"
                    th:attr="data-bookmark-id=${directory.id()},
                             data-bookmark-title=${directory.title()},
                             data-bookmark-type='directory',
                             data-bookmark-favorite=${favoriteBookmarkIds.contains(directory.id())},
                             data-bookmark-open-url=@{/files/bookmarks(directory=${directory.id()})},
                             data-bookmark-detail-url=@{/files/bookmarks/detail(id=${directory.id()})},
                             data-bookmark-delete-url=@{/files/bookmarks/delete}">
                    <td class="select-cell">
                        <input form="bulkActionForm" type="checkbox" name="bookmarkIds" th:value="${directory.id()}">
                    </td>
                    <td>
                        <a class="item-name directory"
                           th:href="@{/files/bookmarks(directory=${directory.id()})}"
                           th:title="${directory.title()}">
                            <i th:class="${directory.iconClass()} + ' item-icon'" aria-hidden="true"></i>
                            <span th:text="${directory.title()}">directory</span>
                        </a>
                    </td>
                    <td th:text="${directory.typeLabel()}">Directory</td>
                    <td th:text="${directory.updatedLabel()}">updated</td>
                    <td>
                        <div class="table-actions">
                            <form class="row-form" method="post" th:action="@{/api/v1/favorites/toggle-bookmark}"
                                  data-favorite-action="toggle" th:attr="data-favorite-path=|bookmark:${directory.id()}|">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="id" th:value="${directory.id()}">
                                <button class="ghost icon-button action-icon favorite-toggle" type="submit"
                                        th:classappend="${favoriteBookmarkIds.contains(directory.id())} ? ' is-favorite' : ''"
                                        th:title="${favoriteBookmarkIds.contains(directory.id()) ? 'Remove from favorites' : 'Add to favorites'}"
                                        th:attr="aria-label=${favoriteBookmarkIds.contains(directory.id()) ? 'Remove from favorites' : 'Add to favorites'}">
                                    <i class="fas fa-star" aria-hidden="true"></i>
                                </button>
                            </form>
                            <a class="button-link ghost icon-button action-icon"
                               th:href="@{/files/bookmarks(directory=${directory.id()})}" title="Open directory" aria-label="Open directory">
                                <i class="fas fa-folder-open" aria-hidden="true"></i>
                            </a>
                            <a class="button-link ghost icon-button action-icon"
                               th:href="@{/files/bookmarks/detail(id=${directory.id()})}"
                               title="Details" aria-label="Details">
                                <i class="fas fa-circle-info" aria-hidden="true"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="browser-section bookmarks-panel" th:if="${not #lists.isEmpty(bookmarkLinks)}" aria-label="Bookmark links">
        <header class="section-heading">
            <h2 th:text="|Links (${#lists.size(bookmarkLinks)})|">Links</h2>
        </header>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th th:replace="~{fragments/tables :: selectHeader('Select all bookmark links in this table')}"></th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Updated</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="link : ${bookmarkLinks}"
                    data-bookmark-context-item="true"
                    th:attr="data-bookmark-id=${link.id()},
                             data-bookmark-title=${link.title()},
                             data-bookmark-type='link',
                             data-bookmark-url=${link.safeUrl()},
                             data-bookmark-external=${link.externalLink()},
                             data-bookmark-favorite=${favoriteBookmarkIds.contains(link.id())},
                             data-bookmark-metadata-enabled=${bookmarkMetadataFetchEnabled},
                             data-bookmark-open-url=@{/files/bookmarks/open(id=${link.id()})},
                             data-bookmark-detail-url=@{/files/bookmarks/detail(id=${link.id()})},
                             data-bookmark-metadata-url=@{/files/bookmarks/metadata},
                             data-bookmark-delete-url=@{/files/bookmarks/delete}">
                    <td class="select-cell">
                        <input form="bulkActionForm" type="checkbox" name="bookmarkIds" th:value="${link.id()}">
                    </td>
                    <td>
                        <a class="item-name bookmark-link-name"
                           th:href="${bookmarkLinkClickAction == 'detail'} ? @{/files/bookmarks/detail(id=${link.id()})} : @{/files/bookmarks/open(id=${link.id()})}"
                           th:title="${link.safeUrl()}"
                           th:target="${bookmarkLinkClickAction == 'open'} ? '_blank' : null"
                           th:rel="${bookmarkLinkClickAction == 'open'} ? 'noopener noreferrer' : null">
                            <img class="bookmark-favicon"
                                 th:if="${link.faviconAvailable()}"
                                 th:src="@{/files/bookmarks/favicon(id=${link.id()})}"
                                 alt=""
                                 loading="lazy">
                            <i th:unless="${link.faviconAvailable()}" th:class="${link.iconClass()} + ' item-icon'" aria-hidden="true"></i>
                            <span class="bookmark-link-title" th:text="${link.title()}">link</span>
                        </a>
                    </td>
                    <td th:text="${link.typeLabel()}">Link</td>
                    <td th:text="${link.updatedLabel()}">updated</td>
                    <td>
                        <div class="table-actions">
                            <form class="row-form" method="post" th:action="@{/api/v1/favorites/toggle-bookmark}"
                                  data-favorite-action="toggle" th:attr="data-favorite-path=|bookmark:${link.id()}|">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="id" th:value="${link.id()}">
                                <button class="ghost icon-button action-icon favorite-toggle" type="submit"
                                        th:classappend="${favoriteBookmarkIds.contains(link.id())} ? ' is-favorite' : ''"
                                        th:title="${favoriteBookmarkIds.contains(link.id()) ? 'Remove from favorites' : 'Add to favorites'}"
                                        th:attr="aria-label=${favoriteBookmarkIds.contains(link.id()) ? 'Remove from favorites' : 'Add to favorites'}">
                                    <i class="fas fa-star" aria-hidden="true"></i>
                                </button>
                            </form>
                            <a class="button-link ghost icon-button action-icon"
                               th:href="@{/files/bookmarks/open(id=${link.id()})}" target="_blank" rel="noopener noreferrer"
                               title="Open link" aria-label="Open link">
                                <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
                            </a>
                            <a class="button-link ghost icon-button action-icon"
                               th:href="@{/files/bookmarks/detail(id=${link.id()})}"
                               title="Details" aria-label="Details">
                                <i class="fas fa-circle-info" aria-hidden="true"></i>
                            </a>
                            <form class="row-form"
                                  method="post"
                                  th:if="${bookmarkMetadataFetchEnabled and link.externalLink()}"
                                  th:action="@{/files/bookmarks/metadata}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="id" th:value="${link.id()}">
                                <input type="hidden" name="parentId" th:value="${currentBookmarkDirectoryId}">
                                <input type="hidden" name="q" th:value="${query}">
                                <button class="ghost icon-button action-icon" type="submit"
                                        title="Fetch title and favicon" aria-label="Fetch title and favicon">
                                    <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="browser-section" th:if="${#lists.isEmpty(bookmarkDirectories) and #lists.isEmpty(bookmarkLinks)}" aria-label="Empty bookmarks">
        <div class="table-wrap">
            <table>
                <tbody>
                <tr class="empty-row">
                    <td class="empty">No bookmarks found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
</div>
</body>
</html>
