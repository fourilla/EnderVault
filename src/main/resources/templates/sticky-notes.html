<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Sticky Notes</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace dashboard-workspace">
    <section th:replace="~{fragments/admin-shell :: pathbar('Sticky Notes', @{/admin/dashboard}, 'Back to dashboard')}"></section>

    <section class="dashboard-panel" aria-label="Sticky note manager">
        <header class="section-heading">
            <div>
                <h2>All Notes</h2>
                <p>Review notes attached to pages, files, directories, and bookmarks.</p>
            </div>
            <span class="status-badge info" th:text="|${#lists.size(notes)} note(s)|">0 note(s)</span>
        </header>

        <form class="search-form" method="get" th:action="@{/admin/sticky-notes}" role="search">
            <label class="search-field">
                <span class="visually-hidden">Search sticky notes</span>
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" name="q" th:value="${q}" placeholder="Search notes or contexts"
                       aria-label="Search sticky notes">
            </label>
            <button class="icon-button" type="submit" title="Search sticky notes" aria-label="Search sticky notes">
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
            </button>
            <a class="button-link ghost icon-button" th:if="${q != null and !q.isBlank()}"
               th:href="@{/admin/sticky-notes}" title="Reset search" aria-label="Reset search">
                <i class="fas fa-rotate-left" aria-hidden="true"></i>
            </a>
        </form>

        <div class="table-wrap compact-table">
            <table>
                <thead>
                <tr>
                    <th>Note</th>
                    <th>Context</th>
                    <th>Surface</th>
                    <th>Updated</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${notes}">
                    <td>
                        <span class="table-primary-text"
                              th:title="${item.note().content()}"
                              th:text="${item.note().summary()}">Note</span>
                    </td>
                    <td>
                        <span class="table-primary-text"
                              th:title="${item.contextLabel()}"
                              th:text="${item.contextLabel()}">Context</span>
                        <small th:text="${item.note().context().targetType()}">PAGE</small>
                    </td>
                    <td th:text="${item.surfaceLabel()}">Page</td>
                    <td th:title="${item.note().updatedAt()}" th:text="${item.updatedLabel()}">updated</td>
                    <td>
                        <span class="status-badge active" th:if="${item.targetExists()}">Available</span>
                        <span class="status-badge expired" th:unless="${item.targetExists()}">Orphan</span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <a class="button-link ghost icon-button action-icon"
                               th:if="${item.openUrl() != null}"
                               th:href="${item.openUrl()}"
                               title="Open target" aria-label="Open target">
                                <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
                            </a>
                            <form class="row-form" method="post"
                                  th:action="@{/admin/sticky-notes/items/{id}/delete(id=${item.note().id()})}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="danger icon-button action-icon" type="submit"
                                        title="Delete sticky note" aria-label="Delete sticky note"
                                        onclick="return confirm('Delete this sticky note?');">
                                    <i class="fas fa-trash-can" aria-hidden="true"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr class="empty-row" th:if="${#lists.isEmpty(notes)}">
                    <td colspan="6" class="empty">No sticky notes found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
</div>
</body>
</html>
