<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm Remote Download</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('remote')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section th:replace="~{fragments/admin-shell :: pathbar('Confirm Download', @{/admin/utils/remote-download}, 'Back')}"></section>

    <section class="dashboard-panel remote-confirm-page">
        <header class="section-heading">
            <h2>Remote File</h2>
        </header>
        <dl class="remote-confirm-details">
            <div>
                <dt>File name</dt>
                <dd th:text="${probe.fileName()}">file.mp4</dd>
            </div>
            <div>
                <dt>Save to</dt>
                <dd th:text="${probe.targetPath()}">downloads/file.mp4</dd>
            </div>
            <div>
                <dt>Size</dt>
                <dd th:text="${probe.contentLengthLabel()}">Unknown</dd>
            </div>
            <div>
                <dt>Type</dt>
                <dd th:text="${probe.contentTypeLabel()}">video/mp4</dd>
            </div>
            <div>
                <dt>Final URL</dt>
                <dd th:text="${probe.finalUrl()}">https://example.com/file.mp4</dd>
            </div>
            <div>
                <dt>Network route</dt>
                <dd th:text="${probe.networkRouteLabel()}">Direct connection</dd>
            </div>
            <div>
                <dt>Inspection</dt>
                <dd th:text="${probe.statusLabel()}">Verified</dd>
            </div>
            <div>
                <dt>Range</dt>
                <dd th:text="${probe.rangeCapabilityLabel()}">Supported</dd>
            </div>
            <div>
                <dt>Request</dt>
                <dd th:text="${probe.requestOptionsLabel()}">1 connection</dd>
            </div>
            <div>
                <dt>Detail</dt>
                <dd th:text="${probe.detail()}">detail</dd>
            </div>
        </dl>
        <p class="remote-confirm-warning"
           th:if="${!probe.warningLabel().isBlank()}"
           th:text="${probe.warningLabel()}"></p>

        <div class="remote-confirm-actions">
            <form method="post" th:action="@{/admin/utils/remote-download/inspect/discard}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="requestId" th:value="${requestId}">
                <button class="ghost" type="submit">Cancel</button>
            </form>
            <form method="post" th:action="@{/admin/utils/remote-download}" th:if="${probe.startAllowed()}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="requestId" th:value="${requestId}">
                <button type="submit">
                    <i class="fas fa-cloud-arrow-down" aria-hidden="true"></i>
                    <span>Start Download</span>
                </button>
            </form>
        </div>
    </section>
</main>
</div>
</div>
</body>
</html>
