<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault VPN Egress Settings</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: adminActionsScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace dashboard-workspace settings-workspace">
    <section th:replace="~{fragments/admin-shell :: pathbar('VPN Egress', @{/admin/settings}, 'Back to settings')}"></section>

    <section class="dashboard-panel settings-detail-panel">
        <header class="section-heading">
            <div>
                <h2>VPN Egress</h2>
                <p th:text="'Saved to ' + ${settings.configPath()}">Saved to endervault-nas.properties</p>
            </div>
            <div class="section-heading-actions">
                <a class="ghost icon-text-button" th:href="@{/admin/vpn}">
                    <i class="fas fa-shield-halved" aria-hidden="true"></i>
                    <span>VPN Status</span>
                </a>
            </div>
        </header>

        <form class="general-settings-form"
              method="post"
              th:action="@{/admin/settings/vpn}"
              data-ajax-action="vpn-settings-save">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="settings-actions-top">
                <button th:replace="~{fragments/settings :: saveButton}"></button>
            </div>

            <section class="settings-detail-section" aria-label="VPN proxy connection">
                <header class="settings-subsection-heading">
                    <div>
                        <h3>Proxy Connection</h3>
                        <p>Provides the private HTTP proxy used when the global outbound route is set to VPN.</p>
                    </div>
                    <label class="settings-heading-switch">
                        <span>Enabled</span>
                        <input class="settings-switch-input"
                               type="checkbox"
                               name="enabled"
                               th:checked="${settings.enabled()}"
                               data-toggle-target=".vpn-settings-dependent">
                    </label>
                </header>
                <div class="settings-field-grid vpn-settings-grid vpn-settings-dependent">
                    <label>
                        <span>Proxy host</span>
                        <input name="proxyHost" th:value="${settings.proxyHost()}" placeholder="vpn">
                        <small>Use the private Compose service name or an internal proxy address.</small>
                    </label>
                    <label>
                        <span>Proxy port</span>
                        <input type="number" name="proxyPort" min="1" max="65535" th:value="${settings.proxyPort()}">
                        <small>HTTP proxy port available inside the private network.</small>
                    </label>
                    <label>
                        <span>Proxy health connect timeout (ms)</span>
                        <input type="number"
                               name="healthConnectTimeoutMs"
                               min="100"
                               max="60000"
                               th:value="${settings.healthConnectTimeoutMs()}">
                        <small>Maximum time allowed to establish the proxy TCP connection.</small>
                    </label>
                </div>
            </section>

            <section class="settings-detail-section" aria-label="VPN tunnel health">
                <header class="settings-subsection-heading">
                    <div>
                        <h3>Tunnel Health</h3>
                        <p>Optionally requires the VPN container health endpoint to return HTTP 200.</p>
                    </div>
                </header>
                <div class="settings-field-grid vpn-settings-grid vpn-settings-dependent">
                    <label>
                        <span>Tunnel health URL</span>
                        <input type="url"
                               name="tunnelHealthUrl"
                               th:value="${settings.tunnelHealthUrl()}"
                               placeholder="http://vpn:9999/">
                        <small>Leave empty for generic proxy TCP-only health.</small>
                    </label>
                    <label>
                        <span>Tunnel health request timeout (ms)</span>
                        <input type="number"
                               name="healthRequestTimeoutMs"
                               min="100"
                               max="60000"
                               th:value="${settings.healthRequestTimeoutMs()}">
                        <small>Maximum time allowed for one tunnel health request.</small>
                    </label>
                    <label>
                        <span>Health check interval (ms)</span>
                        <input type="number"
                               name="healthCheckIntervalMs"
                               min="1000"
                               th:value="${settings.healthCheckIntervalMs()}">
                        <small>Restart required before a new scheduler interval takes effect.</small>
                    </label>
                </div>
            </section>

        </form>
    </section>
</main>
</div>
</div>
</body>
</html>
