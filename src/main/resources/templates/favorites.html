<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Favorites</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('favorites')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace">
    <section class="pathbar" aria-label="Favorites heading">
        <div>
            <p class="breadcrumb-label">Pinned locations</p>
            <h1>Favorites</h1>
        </div>
    </section>

    <section class="dashboard-panel favorites-panel" aria-label="Favorite files and directories">
        <header class="section-heading">
            <h2>Favorite Items</h2>
            <p th:text="|${#lists.size(favoriteItems)} item(s)|">0 item(s)</p>
        </header>

        <div class="table-wrap compact-table">
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Path</th>
                    <th>Added</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="favorite, iter : ${favoriteItems}"
                    th:classappend="${favorite.hidden()} ? 'is-hidden-item' : ''"
                    th:attr="data-favorite-row-path=${favorite.path()}">
                    <td>
                        <a class="item-name"
                           th:href="${favorite.openUrl(bookmarkLinkClickAction)}"
                           th:target="${favorite.opensInNewTab(bookmarkLinkClickAction)} ? '_blank' : null"
                           th:rel="${favorite.opensInNewTab(bookmarkLinkClickAction)} ? 'noopener noreferrer' : null"
                           th:title="${favorite.targetLabel()}">
                            <i th:class="${favorite.iconClass()} + ' item-icon'" aria-hidden="true"></i>
                            <span th:text="${favorite.name()}">favorite</span>
                        </a>
                        <span class="status-badge expired hidden-badge" th:if="${favorite.hidden()}">Hidden</span>
                    </td>
                    <td th:text="${favorite.typeLabel()}">File</td>
                    <td><span class="path-cell" th:title="${favorite.targetLabel()}" th:text="${favorite.targetLabel()}">target</span></td>
                    <td th:text="${favorite.createdLabel()}">created</td>
                    <td>
                        <div class="table-actions">
                            <form class="row-form" method="post" th:action="@{/api/v1/favorites/move}"
                                  data-favorite-action="move" th:attr="data-favorite-path=${favorite.path()}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="path" th:value="${favorite.path()}">
                                <input type="hidden" name="direction" value="up">
                                <button class="ghost icon-button action-icon" type="submit" th:disabled="${iter.first}"
                                        title="Move up" aria-label="Move up">
                                    <i class="fas fa-arrow-up" aria-hidden="true"></i>
                                </button>
                            </form>
                            <form class="row-form" method="post" th:action="@{/api/v1/favorites/move}"
                                  data-favorite-action="move" th:attr="data-favorite-path=${favorite.path()}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="path" th:value="${favorite.path()}">
                                <input type="hidden" name="direction" value="down">
                                <button class="ghost icon-button action-icon" type="submit" th:disabled="${iter.last}"
                                        title="Move down" aria-label="Move down">
                                    <i class="fas fa-arrow-down" aria-hidden="true"></i>
                                </button>
                            </form>
                            <form class="row-form" method="post" th:action="@{/api/v1/favorites/remove}"
                                  data-favorite-action="remove" th:attr="data-favorite-path=${favorite.path()}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="path" th:value="${favorite.path()}">
                                <button class="ghost icon-button action-icon" type="submit" title="Remove" aria-label="Remove">
                                    <i class="fas fa-star-half-stroke" aria-hidden="true"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr class="empty-row" th:if="${#lists.isEmpty(favoriteItems)}">
                    <td colspan="5" class="empty">No favorites yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
</div>
</body>
</html>
