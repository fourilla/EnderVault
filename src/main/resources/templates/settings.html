<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>EnderVault Settings</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: directoryPickerScript}"></th:block>
    <th:block th:replace="~{fragments/assets :: viteEntry(${settingsFrontend})}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace dashboard-workspace settings-workspace">
    <section th:replace="~{fragments/admin-shell :: pathbar('Settings', @{/admin/dashboard}, 'Back to dashboard')}"></section>

    <div id="settings-root" class="settings-react-root">
        <section class="dashboard-panel settings-react-loading" th:if="${settingsFrontend.available()}">
            Loading settings...
        </section>
        <section class="dashboard-panel" th:unless="${settingsFrontend.available()}">
            <header class="section-heading">
                <div>
                    <h2>Settings frontend unavailable</h2>
                    <p>Build the frontend assets or start the configured Vite development server.</p>
                </div>
            </header>
        </section>
    </div>
    <th:block th:replace="~{fragments/directory-picker :: dialog}"></th:block>
</main>
</div>
</div>
</body>
</html>
