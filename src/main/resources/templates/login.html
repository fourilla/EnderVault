<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Login</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: passkeyScript}"></th:block>
</head>
<body class="auth-page">
<div th:replace="~{fragments/notifications :: toasts}"></div>
<main class="auth-shell">
    <section class="auth-panel">
        <p class="eyebrow">Private NAS</p>
        <h1>EnderVault</h1>

        <p class="alert error" th:if="${param.error}">Login failed. Check your ID and password.</p>
        <p class="alert" th:if="${param.logout}">You have been logged out.</p>
        <p class="alert warning" th:if="${param.expired}">This session expired or was revoked.</p>
        <p class="alert" th:if="${param['session-revoked']}">The current session was revoked.</p>
        <p class="alert error" th:if="${!passwordLoginEnabled and !passkeyAvailable}">
            Password login is disabled and no passkey is registered.
        </p>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <form class="stack" method="post" th:action="@{/login}" th:if="${passwordLoginEnabled}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>
                <span>ID</span>
                <input name="username" autocomplete="username" required autofocus>
            </label>

            <label>
                <span>Password</span>
                <div class="password-field">
                    <input name="password"
                           type="password"
                           autocomplete="current-password"
                           required
                           data-password-toggle-input>
                    <button class="ghost icon-button password-toggle"
                            type="button"
                            title="Show password"
                            aria-label="Show password"
                            data-show-label="Show password"
                            data-hide-label="Hide password"
                            data-password-toggle>
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </label>

            <button class="primary" type="submit">Log in</button>
        </form>

        <div class="auth-separator" th:if="${passkeyAvailable and passwordLoginEnabled}">
            <span>or</span>
        </div>

        <div class="auth-passkey" th:if="${passkeyAvailable}">
            <button class="primary passkey-button"
                    type="button"
                    data-passkey-login
                    th:attr="data-options-url=@{/login/passkey/options},data-finish-url=@{/login/passkey/finish}">
                <i class="fas fa-key" aria-hidden="true"></i>
                <span>Log in with passkey</span>
            </button>
        </div>
    </section>
</main>
</body>
</html>
