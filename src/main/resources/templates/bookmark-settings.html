<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnderVault Bookmark Settings</title>
    <th:block th:replace="~{fragments/assets :: styles(true)}"></th:block>
    <th:block th:replace="~{fragments/assets :: coreScripts}"></th:block>
    <th:block th:replace="~{fragments/assets :: adminActionsScript}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/admin-shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/admin-shell :: topbar}"></header>
<div th:replace="~{fragments/notifications :: toasts}"></div>

<main class="workspace dashboard-workspace settings-workspace">
    <section th:replace="~{fragments/admin-shell :: pathbar('Bookmark Settings', @{/admin/settings}, 'Back to settings')}"></section>

    <section class="dashboard-panel settings-detail-panel">
        <header class="section-heading">
            <div>
                <h2>Bookmark Options</h2>
                <p th:text="'Saved to ' + ${settings.configPath()}">Saved to endervault-nas.properties</p>
            </div>
        </header>

        <form class="general-settings-form"
              method="post"
              th:action="@{/admin/settings/bookmarks}"
              data-ajax-action="bookmark-settings-save">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="settings-actions-top">
                <button th:replace="~{fragments/settings :: saveButton}"></button>
            </div>

            <section class="settings-detail-section" aria-label="Bookmark behavior settings">
                <header class="settings-subsection-heading">
                    <div>
                        <h3>Behavior</h3>
                        <p>Controls how bookmark links behave in the list view.</p>
                    </div>
                </header>
                <div class="settings-field-grid">
                    <label>
                        <span>Link click action</span>
                        <select name="linkClickAction">
                            <option value="open" th:selected="${settings.behavior().linkClickAction() == 'open'}">Open link in a new tab</option>
                            <option value="detail" th:selected="${settings.behavior().linkClickAction() == 'detail'}">Open bookmark detail page</option>
                        </select>
                    </label>
                </div>
            </section>

            <section class="settings-detail-section" aria-label="Bookmark metadata settings">
                <header class="settings-subsection-heading">
                    <div>
                        <h3>Metadata Fetch</h3>
                        <p>Fetch page titles and favicons for external HTTP(S) links.</p>
                    </div>
                    <label class="settings-heading-switch">
                        <span>Enabled</span>
                        <input class="settings-switch-input"
                               type="checkbox"
                               name="metadataFetchEnabled"
                               th:checked="${settings.metadata().metadataFetchEnabled()}"
                               data-toggle-target=".bookmark-metadata-dependent">
                    </label>
                </header>
                <div class="settings-field-grid bookmark-metadata-dependent">
                    <label class="settings-inline-toggle">
                        <span>
                            <strong>Block private networks</strong>
                            <small>Keep enabled to reduce SSRF risk against localhost and LAN addresses.</small>
                        </span>
                        <input class="settings-switch-input"
                               type="checkbox"
                               name="blockPrivateNetworks"
                               th:checked="${settings.metadata().blockPrivateNetworks()}">
                    </label>
                    <label>
                        <span>Network route</span>
                        <select name="metadataNetworkRoute">
                            <option value="direct"
                                    th:selected="${settings.metadata().metadataNetworkRoute().settingValue() == 'direct'}">
                                Direct connection
                            </option>
                            <option value="vpn-required"
                                    th:selected="${settings.metadata().metadataNetworkRoute().settingValue() == 'vpn-required'}">
                                VPN required (fail closed)
                            </option>
                        </select>
                        <small>One metadata fetch keeps the selected route for its page, manifest, and favicon requests.</small>
                    </label>
                    <label>
                        <span>Allowed ports</span>
                        <input name="allowedPorts" th:value="${settings.metadata().allowedPorts()}" placeholder="80,443">
                    </label>
                    <label>
                        <span>Connect timeout seconds</span>
                        <input type="number" name="connectTimeoutSeconds" min="1" max="3600" th:value="${settings.metadata().connectTimeoutSeconds()}">
                    </label>
                    <label>
                        <span>Response timeout seconds</span>
                        <input type="number" name="responseTimeoutSeconds" min="1" max="3600" th:value="${settings.metadata().responseTimeoutSeconds()}">
                    </label>
                    <label>
                        <span>Max redirects</span>
                        <input type="number" name="maxRedirects" min="0" max="50" th:value="${settings.metadata().maxRedirects()}">
                    </label>
                    <label>
                        <span>HTML max bytes</span>
                        <input type="number" name="htmlMaxBytes" min="1024" th:value="${settings.metadata().htmlMaxBytes()}">
                    </label>
                    <label>
                        <span>Favicon max bytes</span>
                        <input type="number" name="faviconMaxBytes" min="1024" th:value="${settings.metadata().faviconMaxBytes()}">
                    </label>
                </div>
            </section>

            <section class="settings-detail-section" aria-label="Bookmark cache settings">
                <header class="settings-subsection-heading">
                    <div>
                        <h3>Favicon Cache</h3>
                        <p>Cache location under the EnderVault metadata directory.</p>
                    </div>
                    <span class="status-badge">Restart required</span>
                </header>
                <div class="settings-field-grid">
                    <label>
                        <span>Cache directory</span>
                        <input name="faviconCacheDirectory" th:value="${settings.cache().faviconCacheDirectory()}" placeholder="bookmark-favicons">
                    </label>
                </div>
            </section>
        </form>
    </section>
</main>
</div>
</div>
</body>
</html>
